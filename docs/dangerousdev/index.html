<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0b12">
<title>Dangerous Dev</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Dangerous Dev: Goa Treasure Hunt. A retro platformer across real Goan places, inspired by the 1990 classic Dangerous Dave.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: an old PC monitor. Top status bar, the pixel game screen, bottom message bar, then (on touch screens) a game-pad. Single dark retro theme by design. */
:root{
  --bezel:#0d0b12; --panel:#15121d; --ink:#f4ecd8; --dim:#8c8499; --gold:#ffd23a; --red:#e8402a; --teal:#3fd0c9; --green:#66d44a;
  --px:"Press Start 2P","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bezel);color:var(--ink);font-family:var(--px);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 6px) max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(8px,env(safe-area-inset-left,0px));gap:6px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10px;line-height:1.4;padding:6px 8px;background:var(--panel);box-shadow:inset 0 0 0 2px #2a2436;width:var(--sw,100%)}
.hud b{color:var(--gold);font-weight:400}
.lives{display:flex;gap:2px;align-items:center}
.lives canvas{width:16px;height:16px;image-rendering:pixelated}
#screen{position:relative;width:var(--sw);height:var(--sh);background:#000;box-shadow:0 0 0 3px #2a2436,0 0 40px rgba(80,60,140,.25);overflow:hidden;flex:none}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.crt.off{display:none}
.msg{flex:1;min-width:0;text-align:center;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.inv{display:flex;align-items:center;gap:6px}
.inv canvas{width:16px;height:16px;image-rendering:pixelated}
.fuel{width:46px;height:8px;background:#000;box-shadow:inset 0 0 0 1px var(--dim)}
.fuel i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transform-origin:left}

/* overlays inside the screen */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center;background:rgba(5,3,10,.72)}
.ov.clear{background:transparent}
.logo{font-size:clamp(18px,6.2vw,34px);line-height:1.2;color:var(--gold);text-shadow:3px 3px 0 var(--red);letter-spacing:1px;padding:10px 12px;background:rgba(5,3,10,.55)}
.logo small{display:block;font-size:.42em;color:var(--teal);text-shadow:2px 2px 0 #000;margin-top:10px;letter-spacing:2px}
.press{font-size:11px;color:#fff;animation:blink 1s steps(1) infinite}
.menu{display:flex;flex-direction:column;gap:8px;min-width:min(230px,90%)}
.mbtn{padding:10px 12px;font-size:10px;background:#211b2e;box-shadow:inset 0 0 0 2px #4a3f63,0 3px 0 #000;color:#fff;text-align:center}
.mbtn:hover,.mbtn:focus-visible{background:#2f2742;color:var(--gold)}
.mbtn.primary{background:var(--red);box-shadow:inset 0 0 0 2px #ff8a6a,0 3px 0 #000}
.mbtn:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px #4a3f63}
.credit{font-size:7px;line-height:1.8;color:#cfc6dd;max-width:360px;padding:6px 8px;background:rgba(5,3,10,.7)}
.credit b{color:var(--ink);font-weight:400}
.card{background:#120e1a;box-shadow:inset 0 0 0 2px #4a3f63,0 0 0 2px #000;padding:14px 12px;max-width:min(360px,96%);max-height:100%;overflow:auto}
.card h2{font-size:12px;color:var(--gold);margin:0 0 10px;line-height:1.5;font-weight:400}
.card p{font-size:8.5px;line-height:1.9;margin:6px 0;color:#e8e0d0}
.card .k{color:var(--teal)}
.lvlno{font-size:9px;color:var(--teal);letter-spacing:2px}
.lvlname{font-size:clamp(14px,4.6vw,20px);color:#fff;text-shadow:2px 2px 0 var(--red);line-height:1.4}
.lvlplace{font-size:9px;color:var(--gold)}
.fact{font-size:8px;line-height:1.9;color:#d8d0c0;max-width:340px;padding:8px 10px;background:rgba(255,255,255,.06)}
.q{font-size:clamp(16px,5vw,22px);color:#fff;margin:8px 0}
.opts{display:flex;gap:8px;justify-content:center}
.opts .mbtn{min-width:64px;font-size:13px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.scores{font-size:9px;line-height:2;text-align:left;min-width:200px}
.scores li{display:flex;justify-content:space-between;gap:14px}
.scores ol{margin:0;padding-left:18px}
input.name{font:inherit;font-size:11px;background:#000;color:var(--gold);border:0;box-shadow:inset 0 0 0 2px #4a3f63;padding:8px;width:180px;text-transform:uppercase;text-align:center}
.tiny{font-size:7px;color:var(--dim);line-height:1.8}
.corner{position:absolute;top:6px;right:6px;display:flex;gap:6px}
.corner button{width:28px;height:28px;font-size:10px;background:rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px #4a3f63}

/* touch game-pad */
#pad{display:flex;justify-content:space-between;align-items:center;width:var(--sw);flex:1;min-height:150px;max-height:230px;padding:4px 6px;touch-action:none}
#pad.land{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);width:auto;padding:0 max(14px,env(safe-area-inset-left,0px));pointer-events:none;min-height:0}
#pad.land > *{pointer-events:auto;opacity:.75}
.dpad{position:relative;width:150px;height:150px;border-radius:50%;background:#1d1828;box-shadow:inset 0 0 0 3px #3a3150,0 4px 0 #000;touch-action:none}
.dpad i{position:absolute;background:#3a3150;border-radius:6px}
.dpad i.h{left:20px;right:20px;top:58px;height:34px}
.dpad i.v{top:20px;bottom:20px;left:58px;width:34px}
.dpad span{position:absolute;font-size:12px;color:#bfb6d6;pointer-events:none}
.dpad .on{color:var(--gold)}
.btns{display:grid;grid-template-columns:repeat(2,auto);grid-template-rows:auto auto;gap:10px 12px;align-items:center;touch-action:none}
.pb{width:62px;height:62px;border-radius:50%;font-size:9px;display:grid;place-items:center;background:#3a3150;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),0 4px 0 #000;color:#fff;touch-action:none}
.pb.a{width:78px;height:78px;background:var(--red);grid-row:1 / span 2;grid-column:2;font-size:10px}
.pb.dis{opacity:.35}
.pb.down{transform:translateY(3px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.35),0 1px 0 #000}
.pb.jet.onjet{background:var(--teal);color:#000}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

</head>
<body>
<div id="app">
  <div class="hud" id="hudTop">
    <span>SCORE: <b id="hScore">00000</b></span>
    <span>LEVEL: <b id="hLevel">1</b></span>
    <span class="lives">DEV: <span id="hLives"></span></span>
  </div>
  <div id="screen">
    <canvas id="cv"></canvas>
    <div class="crt" id="crt"></div>
    <div class="corner" id="corner" hidden><button id="bPause" type="button" aria-label="Pause">II</button><button id="bMusic" type="button" aria-label="Music">♪</button></div>
    <div class="ov clear" id="title">
      <div class="logo">DANGEROUS<br>DEV<small>GOA TREASURE HUNT</small></div>
      <div class="press" id="press">PRESS START</div>
      <div class="menu">
        <button class="mbtn primary" id="mStart" type="button">START GAME</button>
        <button class="mbtn" id="mLevels" type="button">LEVEL SELECT</button>
        <button class="mbtn" id="mHow" type="button">HOW TO PLAY</button>
        <button class="mbtn" id="mHi" type="button">HIGH SCORES</button>
      </div>
      <div class="credit">Inspired by the classic 1990 PC game <b>Dangerous Dave</b> by <b>John Romero</b>.<br>An original tribute by MHC Digital for Hinde Classes. All characters, art and levels are new.</div>
    </div>
    <div class="ov" id="panel" hidden><div class="card" id="panelCard"></div></div>
  </div>
  <div class="hud" id="hudBot">
    <span class="inv" id="hInv"></span>
    <span class="msg" id="hMsg">FIND THE GOLDEN GHUMOT!</span>
    <span class="inv"><span class="fuel" id="hFuelBox" hidden><i id="hFuel"></i></span></span>
  </div>
  <div id="pad" hidden>
    <div class="dpad" id="dpad" aria-label="Direction pad"><i class="h"></i><i class="v"></i><span id="dU" style="left:66px;top:28px">▲</span><span id="dD" style="left:66px;bottom:28px">▼</span><span id="dL" style="left:28px;top:68px">◀</span><span id="dR" style="right:28px;top:68px">▶</span></div>
    <div class="btns">
      <button class="pb fire dis" id="bFire" type="button" aria-label="Fire slingshot">FIRE</button>
      <button class="pb a" id="bJump" type="button" aria-label="Jump">JUMP</button>
      <button class="pb jet dis" id="bJet" type="button" aria-label="Jetpack">JET</button>
    </div>
  </div>
</div>

<script>
/* ===== Dangerous Dev engine (pure logic, no drawing) ===== */
const T = 16, ROWS = 12;
const PHYS = {run: 92, grav: 980, jumpV: 292, maxFall: 400, climb: 62, fly: 92, fuelPerSec: .085};
const SOLID = "#=WBR";        // laterite, grass ground, stone masonry, basalt, roof tiles
const HAZARD = "~^f";         // water, thorns, fire
const ITEM_PTS = {k: 50, o: 75, m: 100, b: 150, x: 250, T: 1000, "1": 0, S: 0, J: 0};
const ITEM_NAME = {k: "Cashew", o: "Kokum", m: "Mankurad mango", b: "Bebinca", x: "Xerafim coin", T: "Golden Ghumot", "1": "Extra life", S: "Slingshot", J: "Jetpack"};

function parseLevel(def){
  const rows = def.map.map(r => r.split(""));

    for (let y = 3; y < 32; y += 5){ rect(g, 1, y, 14, 2, "#9a6533"); rect(g, 1, y, 14, 1, "#c08a4e"); }
    for (let x = 4; x < 13; x += 3) rect(g, x, 0, 1, 32, "#7a4c24");
    rect(g, 5, 13, 6, 6, "#e0b030"); rect(g, 6, 10, 4, 4, "#e0b030"); rect(g, 7, 11, 2, 3, "#5e3a1a"); rect(g, 7, 15, 2, 2, "#3a2410"); // padlock
    return c;
  }
  function lamp(on){
    const [c, g] = mk(16, 32);
    rect(g, 7, 10, 2, 22, "#2b2f36"); rect(g, 5, 29, 6, 3, "#2b2f36"); rect(g, 6, 9, 4, 1, "#2b2f36");
    rect(g, 4, 2, 8, 7, "#2b2f36"); rect(g, 5, 3, 6, 5, on ? "#ffe27a" : "#58606b"); rect(g, 3, 1, 10, 1, "#2b2f36"); px(g, 8, 0, "#2b2f36");
    if (on){ rect(g, 6, 4, 2, 2, "#fffbe0"); }
    return c;
  }

  /* ---------- level layer ---------- */
  function levelCanvas(L, theme){
    seed = 99 + L.w;
    const [c, g] = mk(L.w*16, L.h*16);
    for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++){
      const t = L.grid[y][x]; if (".~fg".includes(t)) continue;
      drawTile(g, t, x*16, y*16, theme, y > 0 ? L.grid[y - 1][x] : ".");
    }
    return c;
  }

  /* ---------- parallax backgrounds (each layer 480 x 192, tiles horizontally) ---------- */
  function sky(g, w, h, stops){ const n = stops.length; for (let y = 0; y < h; y++){ const t = y/h*(n - 1), i = Math.min(n - 2, Math.floor(t)), f = t - i; // dithered bands
      const c = (f > .5) !== ((y % 2) === 0 && Math.abs(f - .5) < .18) ? stops[i + 1] : stops[i]; rect(g, 0, y, w, 1, c); } }
  function cloud(g, x, y, s){ disc(g, x, y, 5*s, "#ffffff"); disc(g, x + 7*s, y - 2*s, 6*s, "#ffffff"); disc(g, x + 14*s, y, 5*s, "#ffffff"); rect(g, x - 4*s, y, 22*s, 4*s, "#ffffff"); rect(g, x - 4*s, y + 3*s, 22*s, 1, "#d8ecf5"); }
  function palm(g, x, base, h, trunk, leaf, leaf2){
    let cx = x; for (let y = 0; y < h; y++){ cx = x + Math.round(Math.sin(y/h*1.4)*3); rect(g, cx, base - y, 3, 1, trunk); if (y % 3 === 0) px(g, cx + 1, base - y, leaf2 || "#00000033"); }
    const tx = cx + 1, ty = base - h;
    const fr = [[-12, 5], [-9, -3], [-3, -7], [4, -7], [10, -3], [12, 5], [7, 8], [-7, 8]];
    for (const [dx, dy] of fr){ for (let i = 0; i <= 10; i++){ const t = i/10, x2 = tx + dx*t, y2 = ty + dy*t + t*t*4; rect(g, x2, y2, 2, 1, leaf); if (i % 2) px(g, x2 + (dx > 0 ? -1 : 1), y2 + 1, leaf2 || leaf); } }
    disc(g, tx, ty + 1, 2, "#6b4a1e");
  }
  function house(g, x, base, w, h, wall, trim){
    rect(g, x, base - h, w, h, wall); rect(g, x, base - h, w, 1, trim); rect(g, x, base - 2, w, 2, "#00000022");
    for (let i = 0; i < Math.floor(w/9); i++){ const wx = x + 3 + i*9; rect(g, wx - 1, base - h + 4, 6, 8, trim); rect(g, wx, base - h + 5, 4, 6, "#2a5a7a"); }
    rect(g, x + w/2 - 3, base - 9, 6, 9, trim); rect(g, x + w/2 - 2, base - 8, 4, 8, "#5a3a1c");
    tri(g, x - 3, base - h, x + w + 3, base - h, x + w/2, base - h - 9, "#b8482a");
    for (let y = 0; y < 8; y += 2) rect(g, x - 2 + y*.9, base - h - 1 - y, w + 4 - y*1.8, 1, "#d9693e");
  }
  function backgrounds(theme){
    seed = theme === "village" ? 11 : theme === "fort" ? 23 : 37;
    const W = 480, H = 192, L = [];
    const [far, gf] = mk(W, H), [mid, gm] = mk(W, H), [near, gn] = mk(W, H);
    if (theme === "village"){
      sky(gf, W, H, ["#79c3ea", "#a6d8ef", "#d5eef3", "#f6ecd0"]);
      for (let i = 0; i < 4; i++) cloud(gf, 30 + i*120 + rnd()*40, 22 + rnd()*30, 1 + Math.round(rnd()));
      // Western Ghats hills
      for (let x = 0; x < W; x++){ const y = 98 + Math.sin(x/38)*10 + Math.sin(x/13)*3; rect(gf, x, y, 1, H - y, "#6f9ab0"); }
      for (let x = 0; x < W; x++){ const y = 112 + Math.sin(x/27 + 1)*8 + Math.sin(x/9)*2; rect(gf, x, y, 1, H - y, "#4f8a78"); }
      // Mayem lake band + village
      rect(gm, 0, 136, W, 18, "#4aa5c4"); for (let i = 0; i < 40; i++) rect(gm, rnd()*W, 138 + rnd()*14, 4 + rnd()*6, 1, "#bfe6ef");
      rect(gm, 0, 150, W, H - 150, "#5fae45"); for (let y = 152; y < H; y += 3) rect(gm, 0, y, W, 1, "#6fbe52");   // paddy fields
      const cols = [["#f2c94c", "#ffffff"], ["#4a90c8", "#ffffff"], ["#e8875a", "#fff2e0"], ["#7cc08a", "#ffffff"]];
      for (let i = 0; i < 5; i++){ const [w, t] = cols[i % 4]; house(gm, 20 + i*96 + rnd()*20, 150, 34 + Math.round(rnd()*10), 20, w, t); }
      for (let i = 0; i < 9; i++) palm(gm, 8 + i*54 + rnd()*20, 150, 34 + rnd()*16, "#7a5a32", "#2f7a32", "#3f9a3e");
      for (let i = 0; i < 5; i++) palm(gn, 40 + i*100 + rnd()*30, 192, 70 + rnd()*20, "#5e4224", "#24622a", "#2f7a32");
    } else if (theme === "fort"){
      sky(gf, W, H, ["#3a2d6b", "#a8507a", "#f08a5a", "#ffd08a"]);
      disc(gf, 380, 118, 16, "#ffe9a8"); disc(gf, 380, 118, 13, "#fff4cf");
      rect(gf, 0, 124, W, H - 124, "#2a5a94"); for (let i = 0; i < 60; i++) rect(gf, rnd()*W, 126 + rnd()*40, 3 + rnd()*8, 1, rnd() < .4 ? "#ffd08a" : "#4f86c0");
      // headland with the Aguada lighthouse
      for (let x = 0; x < 200; x++){ const y = 112 + Math.max(0, (x - 120))*.15 + Math.sin(x/17)*3; rect(gm, x, y, 1, H - y, "#3a2a2a"); }
      rect(gm, 0, 104, 150, 12, "#6a3a28"); for (let x = 0; x < 150; x += 8) rect(gm, x, 100, 5, 4, "#6a3a28");
      rect(gm, 60, 58, 14, 46, "#f2efe6"); rect(gm, 60, 58, 3, 46, "#d6d1c4"); rect(gm, 58, 54, 18, 5, "#2b2f36"); rect(gm, 62, 46, 10, 8, "#ffe27a"); rect(gm, 61, 44, 12, 2, "#2b2f36"); px(gm, 67, 42, "#2b2f36");
      for (let i = 0; i < 4; i++){ const bx = 240 + i*60 + rnd()*20, by = 140 + rnd()*20; tri(gm, bx, by, bx + 18, by, bx + 14, by + 4, "#5a2f1c"); rect(gm, bx + 8, by - 10, 1, 10, "#3a2010"); tri(gm, bx + 9, by - 10, bx + 9, by - 2, bx + 15, by - 3, "#f2efe6"); }
      for (let i = 0; i < 6; i++){ const x = 120 + rnd()*340, y = 30 + rnd()*40; rect(gm, x, y, 2, 1, "#2a1e2e"); rect(gm, x + 3, y, 2, 1, "#2a1e2e"); px(gm, x + 2, y + 1, "#2a1e2e"); }
      for (let x = 0; x < W; x++){ const y = 170 + Math.sin(x/15)*3; rect(gn, x, y, 1, H - y, "#c8a46a"); } // sand
    } else {
      sky(gf, W, H, ["#8fd0e8", "#b8e2ea", "#dff2ec"]);
      // cliffs + Dudhsagar falls (sea of milk) + railway bridge
      rect(gf, 0, 30, W, H, "#3e6e46");
      for (let i = 0; i < 400; i++) disc(gf, rnd()*W, 40 + rnd()*150, 2 + Math.floor(rnd()*4), rnd() < .5 ? "#2f5c38" : "#4f8a52");
      for (const fx of [150, 330]){ for (let y = 20; y < H; y++){ const w = 26 + Math.floor((y - 20)/8); for (let x = -w/2; x < w/2; x++){ const v = (x*7 + y*3) % 11; px(gf, fx + x, y, v < 3 ? "#d6eef5" : v < 6 ? "#ffffff" : "#eef8fb"); } } }
      // bridge with arches
      rect(gm, 0, 92, W, 8, "#8a8f98"); rect(gm, 0, 92, W, 1, "#b3b8c0"); rect(gm, 0, 100, W, 2, "#5a5f68");
      for (let x = 0; x < W; x += 40){ rect(gm, x, 102, 10, 90, "#7a7f88"); rect(gm, x, 102, 2, 90, "#9aa0a8"); for (let a = 0; a < 15; a++){ const r = 15 - a; rect(gm, x + 10 + a, 102 + 15 - Math.round(Math.sqrt(Math.max(0, r*r))) , 1, 1, "#7a7f88"); } }
      for (let i = 0; i < 30; i++) rect(gm, rnd()*W, 120 + rnd()*72, 2 + rnd()*6, 1, "#ffffff");
      for (let i = 0; i < 6; i++) palm(gn, 30 + i*80 + rnd()*30, 192, 50 + rnd()*30, "#4e3a22", "#1f5a2a", "#2e7a36");
    }
    return [far, mid, near];
  }
  function train(){ // small brown-and-cream train for the Dudhsagar bridge
    const [c, g] = mk(132, 12);
    rect(g, 0, 2, 20, 8, "#3a5a8a"); rect(g, 2, 0, 10, 3, "#2a2a2a"); rect(g, 14, 3, 4, 3, "#ffe27a");
    for (let i = 0; i < 4; i++){ const x = 22 + i*27; rect(g, x, 2, 25, 8, "#7a2a20"); rect(g, x, 5, 25, 2, "#f2e6c8"); for (let k = 0; k < 4; k++) rect(g, x + 2 + k*6, 3, 4, 2, "#ffe9a8"); }
    for (let x = 2; x < 130; x += 7) disc(g, x, 10, 1, "#1a1a1a");
    return c;
  }
  return {sprite, drawTile, waterTile, fireTile, door, gate, lamp, levelCanvas, backgrounds, train, THEMES};
})();

<script>
/* ================= Dangerous Dev: game ================= */
const $ = s => document.querySelector(s);
const store = {get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }};
const cv = $("#cv"), ctx = cv.getContext("2d");
let VW = 192, VH = 192, SCALE = 2;
const touch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;

/* ---------- layout ---------- */
function layout(){
  const W = innerWidth, H = innerHeight, land = W > H;
  const padH = touch && !land ? Math.min(220, Math.max(160, H*.26)) : 0;
  const availW = W - 16, availH = H - 24 - 2*30 - padH - 12;
  let s = Math.min(availH/192, availW/160);
  s = s >= 2 ? Math.floor(s) : Math.max(1, s);
  SCALE = s; VH = 192; VW = Math.max(160, Math.min(416, Math.floor(availW/s)));
  cv.width = VW; cv.height = VH;
  const sw = Math.round(VW*s), sh = Math.round(VH*s);
  document.documentElement.style.setProperty("--sw", sw + "px"); document.documentElement.style.setProperty("--sh", sh + "px");
  ctx.imageSmoothingEnabled = false;
  const pad = $("#pad"); pad.hidden = !touch; pad.classList.toggle("land", touch && land);
}
addEventListener("resize", layout);

/* ---------- audio: chiptune ---------- */
let AC = null, master = null, musicOn = store.get("dd_music", true), musicTimer = null, jetNoise = null;
function audio(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination); } catch { return; } }
  if (AC.state === "suspended") AC.resume();
}
function blip(freq, dur, type = "square", vol = .12, slide = 0, delay = 0){
  if (!AC) return; const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq*slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0005, t0 + dur); o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + .02);
}
function noiseB(dur, vol = .15, freq = 1200, delay = 0){
  if (!AC) return; const n = Math.floor(AC.sampleRate*dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random()*2 - 1;
  const s = AC.createBufferSource(); s.buffer = b; const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq; const g = AC.createGain(), t0 = AC.currentTime + delay;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0005, t0 + dur); s.connect(f).connect(g).connect(master); s.start(t0);
}
const SFX = {
  jump(){ blip(260, .16, "square", .09, 2.2); },
  pick(){ blip(880, .06, "square", .08); blip(1320, .09, "square", .08, 1, .06); },
  coin(){ blip(988, .07, "square", .08); blip(1480, .14, "square", .08, 1, .07); },
  trophy(){ [523, 659, 784, 1047, 784, 1047].forEach((f, i) => blip(f, .12, "square", .1, 1, i*.09)); },
  die(){ blip(600, .7, "square", .12, .08); noiseB(.5, .12, 900, .1); },
  shoot(){ blip(500, .08, "triangle", .12, .4); },
  hit(){ noiseB(.15, .15, 2400); blip(200, .12, "square", .08, .5); },
  door(){ [392, 523, 659, 784, 1047].forEach((f, i) => blip(f, .16, "square", .1, 1, i*.11)); },
  life(){ [660, 880, 1100, 1320].forEach((f, i) => blip(f, .08, "square", .09, 1, i*.07)); },
  ok(){ blip(660, .08, "square", .1); blip(990, .16, "square", .1, 1, .08); },
  bad(){ blip(180, .25, "sawtooth", .1, .7); },
  lamp(){ blip(520, .1, "triangle", .12); blip(780, .18, "triangle", .12, 1, .1); }
};
const NOTE = n => { const m = {C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11}; return 440*Math.pow(2, ((+n.slice(-1) + 1)*12 + m[n[0]] + (n[1] === "#" ? 1 : 0) - 69)/12); };
const LEAD = "E5 G5 A5 G5 E5 D5 C5 D5 E5 E5 G5 E5 D5 C5 A4 C5 D5 E5 G5 A5 C6 A5 G5 E5 D5 E5 D5 C5 A4 G4 A4 -".split(" ");
const BASS = "C3 C3 G2 G2 A2 A2 E2 E2 F2 F2 C3 C3 G2 G2 G2 G2".split(" ");
function startMusic(){
  if (!AC || musicTimer || !musicOn) return;
  let step = 0, next = AC.currentTime + .1; const spb = 60/150/2;
  musicTimer = setInterval(() => {
    while (next < AC.currentTime + .25){
      const n = LEAD[step % LEAD.length]; if (n !== "-") blip(NOTE(n), spb*.9, "square", .035, 1, next - AC.currentTime);
      if (step % 2 === 0){ const b = BASS[(step/2) % BASS.length]; blip(NOTE(b), spb*1.8, "triangle", .07, 1, next - AC.currentTime); }
      if (step % 4 === 2) noiseB(.04, .025, 6000, next - AC.currentTime);
      step++; next += spb;
    }
  }, 60);
}
function stopMusic(){ clearInterval(musicTimer); musicTimer = null; }
$("#bMusic").onclick = () => { audio(); musicOn = !musicOn; store.set("dd_music", musicOn); musicOn && G.state === "play" ? startMusic() : stopMusic(); $("#bMusic").style.opacity = musicOn ? 1 : .4; };

/* ---------- tiny pixel digits for score pop-ups ---------- */
const DIG = {"0": "111101101101111", "1": "010110010010111", "2": "111001111100111", "3": "111001111001111", "4": "101101111001001", "5": "111100111001111", "6": "111100111101111", "7": "111001010010010", "8": "111101111101111", "9": "111101111001111", "+": "000010111010000"};
function pixText(str, x, y, col){ ctx.fillStyle = col; let cx = x; for (const ch of str){ const m = DIG[ch]; if (m) for (let i = 0; i < 15; i++) if (m[i] === "1") ctx.fillRect(cx + (i % 3), y + Math.floor(i/3), 1, 1); cx += 4; } }

/* ---------- game state ---------- */
const G = {state: "title", lvl: 0, L: null, p: null, score: 0, lives: 3, nextLife: 20000, trophy: false, lamp: null, cam: 0, shots: [], parts: [], pops: [], t: 0, deadT: 0, inv: 0, fireCd: 0, gateCd: 0, unlocked: store.get("dd_unlocked", 1), msgT: 0};
let LV = [], BG = {}, LEVELCV = [], TRAIN = null, DOOR = [null, null], GATE = null, LAMP = [null, null];
function prepArt(){
  LV = LEVELS.map(d => d);
  BG = {village: ART.backgrounds("village"), fort: ART.backgrounds("fort"), falls: ART.backgrounds("falls")};
  TRAIN = ART.train(); DOOR = [ART.door(false), ART.door(true)]; GATE = ART.gate(); LAMP = [ART.lamp(false), ART.lamp(true)];
}
function loadLevel(i, keep){
  G.lvl = i; G.L = parseLevel(LV[i]); G.theme = LV[i].theme; G.levelCv = ART.levelCanvas(G.L, G.theme);
  G.p = mkPlayer(G.L); G.trophy = false; G.lamp = null; G.shots = []; G.parts = []; G.pops = []; G.cam = 0; G.inv = 1; G.trainX = -200;
  setMsg("FIND THE GOLDEN GHUMOT!", true); hud();
}
function newGame(level = 0){ G.score = 0; G.lives = 3; G.nextLife = 20000; showCard(level); }
function setMsg(m, blink){ const e = $("#hMsg"); e.textContent = m; e.classList.toggle("blink", !!blink); }
function hud(){
  $("#hScore").textContent = String(G.score).padStart(5, "0"); $("#hLevel").textContent = G.lvl + 1;
  const l = $("#hLives"); l.innerHTML = ""; for (let i = 0; i < Math.min(G.lives, 6); i++){ const c = document.createElement("canvas"); c.width = c.height = 16; c.getContext("2d").drawImage(ART.sprite("oneup"), 0, 0); l.appendChild(c); }
  const inv = $("#hInv"); inv.innerHTML = "";
  const add = n => { const c = document.createElement("canvas"); c.width = c.height = 16; c.getContext("2d").drawImage(ART.sprite(n), 0, 0); inv.appendChild(c); };
  if (G.p && G.p.hasSling) add("sling"); if (G.p && G.p.hasJet) add("jetpack"); if (G.trophy) add("ghumot");
  $("#hFuelBox").hidden = !(G.p && G.p.hasJet);
  $("#bFire").classList.toggle("dis", !(G.p && G.p.hasSling)); $("#bJet").classList.toggle("dis", !(G.p && G.p.hasJet));
}
function addScore(n, x, y){
  G.score += n; if (n > 0 && x !== undefined) G.pops.push({x, y, s: "+" + n, t: 1});
  if (G.score >= G.nextLife){ G.lives++; G.nextLife += 20000; SFX.life(); }
  hud();
}
function burst(x, y, cols, n = 14, sp = 70){ for (let i = 0; i < n; i++){ const a = Math.random()*6.28, v = sp*(.4 + Math.random()); G.parts.push({x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 30, t: .6 + Math.random()*.5, c: cols[i % cols.length]}); } }

/* ---------- screens ---------- */
function panel(html, cls){ $("#panelCard").innerHTML = html; $("#panel").hidden = false; $("#panel").className = "ov " + (cls || ""); }
function hidePanel(){ $("#panel").hidden = true; }
function showTitle(){
  G.state = "title"; stopMusic(); hidePanel(); $("#title").hidden = false; $("#corner").hidden = true;
  if (!G.L || G.lvl !== 0) loadLevel(0); G.attract = 0; setMsg("PRESS START", true);
}
function showCard(i){
  G.state = "card"; $("#title").hidden = true; loadLevel(i); stopMusic();
  const d = LV[i];
  panel(`<div class="lvlno">LEVEL ${i + 1} OF ${LV.length}</div><div class="lvlname">${d.name.toUpperCase()}</div><div class="lvlplace">${d.place.toUpperCase()}, GOA</div>
    <p class="fact">${d.fact}</p><button class="mbtn primary" id="goBtn" type="button">LET'S GO!</button><div class="tiny">${touch ? "TAP TO START" : "PRESS ENTER"}</div>`);
  $("#goBtn").onclick = startPlay;
}
function startPlay(){ audio(); hidePanel(); G.state = "play"; $("#corner").hidden = false; startMusic(); G.inv = 1; }
function showHow(back){
  panel(`<h2>HOW TO PLAY</h2>
    <p>Grab the <span class="k">GOLDEN GHUMOT</span> in each level, then go through the <span class="k">DOOR</span>.</p>
    <p>Collect Goan treats for points: cashew 50, kokum 75, Mankurad mango 100, bebinca 150, xerafim coin 250.</p>
    <p>Fire, water and thorns are deadly. So are crabs, crows, monkeys and bats.</p>
    <p>Find the <span class="k">SLINGSHOT</span> to fire pebbles, and the <span class="k">JETPACK</span> to fly.</p>
    <p>Some gates are locked: solve a quick sum to open them.</p>
    <p class="k">${touch ? "PAD: move & climb · JUMP · FIRE · JET" : "ARROWS move/climb · UP or SPACE jump · X fire · Z jetpack · P pause"}</p>
    <button class="mbtn primary" id="hb" type="button">BACK</button>`);
  $("#hb").onclick = () => { hidePanel(); if (back) back(); };
}
function hiscores(){ return store.get("dd_hi", []); }
function showHi(){
  const h = hiscores();
  panel(`<h2>HIGH SCORES</h2><ol class="scores">${h.length ? h.map(s => `<li><span>${s.n}</span><span>${String(s.s).padStart(5, "0")} · L${s.l}</span></li>`).join("") : "<li><span>No scores yet</span></li>"}</ol>
    <p class="tiny">Scores are saved on this device. Online leaderboard arrives in the next update.</p><button class="mbtn primary" id="hb" type="button">BACK</button>`);
  $("#hb").onclick = hidePanel;
}
function showLevels(){
  panel(`<h2>LEVEL SELECT</h2><div class="menu">${LV.map((d, i) => `<button class="mbtn${i < G.unlocked ? "" : " dis"}" data-l="${i}" type="button" ${i < G.unlocked ? "" : "disabled"}>${i + 1}. ${d.name.toUpperCase()}${i < G.unlocked ? "" : " 🔒"}</button>`).join("")}</div>
    <p class="tiny">Finish a level to unlock the next.</p><button class="mbtn" id="hb" type="button">BACK</button>`);
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { audio(); G.score = 0; G.lives = 3; G.nextLife = 20000; showCard(+b.dataset.l); });
  $("#hb").onclick = hidePanel;
}
$("#mStart").onclick = () => { audio(); newGame(0); };
$("#mHow").onclick = () => showHow();
$("#mHi").onclick = showHi;
$("#mLevels").onclick = showLevels;

function levelDone(){
  SFX.door(); addScore(2000);
  G.unlocked = Math.max(G.unlocked, Math.min(LV.length, G.lvl + 2)); store.set("dd_unlocked", G.unlocked);
  const left = LV.length - (G.lvl + 1);
  G.state = "walk"; G.walkT = 0; stopMusic(); $("#corner").hidden = true;
  setMsg("", false);
  panel(`<div class="lvlname" style="color:var(--gold)">BOREM KELEM, DEV!</div><div class="tiny" style="color:#fff">(WELL DONE IN KONKANI)</div>
    <div class="lvlplace" style="margin-top:6px">${left ? `ONLY ${left} MORE TO GO!` : "YOU FOUND EVERY GOLDEN GHUMOT!"}</div><div class="tiny">LEVEL BONUS +2000</div>`, "clear");
}
function afterWalk(){
  hidePanel();
  if (G.lvl + 1 < LV.length) showCard(G.lvl + 1);
  else gameEnd(true);
}
function gameEnd(won){
  G.state = "over"; stopMusic(); $("#corner").hidden = true;
  const h = hiscores(), qual = G.score > 0 && (h.length < 5 || G.score > h[h.length - 1].s);
  const name = (store.get("dg_user", null)?.name || "").toUpperCase().slice(0, 10);
  panel(`${won ? `<div class="lvlname" style="color:var(--gold)">TO BE CONTINUED…</div><p class="fact">Dev has found all 3 Golden Ghumots so far! Next adventures: Lamgao Caves, Fontainhas in Panjim, Palolem Beach and more.</p>`
                 : `<div class="lvlname" style="color:var(--red)">GAME OVER</div>`}
    <div class="lvlplace">SCORE ${String(G.score).padStart(5, "0")}</div>
    ${qual ? `<div class="tiny">NEW HIGH SCORE! ENTER YOUR NAME</div><input class="name" id="nm" maxlength="10" value="${name}" aria-label="Your name"><button class="mbtn primary" id="sv" type="button">SAVE</button>`
           : `<button class="mbtn primary" id="sv" type="button">TITLE SCREEN</button>`}`);
  if (won) SFX.trophy(); else SFX.die();
  $("#sv").onclick = () => {
    if (qual){ const n = ($("#nm").value.trim() || "DEV").toUpperCase().slice(0, 10); const list = hiscores(); list.push({n, s: G.score, l: G.lvl + 1}); list.sort((a, b) => b.s - a.s); store.set("dd_hi", list.slice(0, 5)); }
    showTitle(); if (qual) showHi();
  };
}

/* ---------- maths gates ---------- */
const R = (a, b) => a + Math.floor(Math.random()*(b - a + 1));
function makeQ(lvl){
  let q, a;
  if (lvl === 0){ if (Math.random() < .5){ const x = R(3, 12), y = R(2, 9); q = `${x} + ${y}`; a = x + y; } else { const x = R(9, 18), y = R(2, 8); q = `${x} − ${y}`; a = x - y; } }
  else if (lvl === 1){ const x = R(2, 5), y = R(3, 10); q = `${x} × ${y}`; a = x*y; }
  else { if (Math.random() < .5){ const x = R(3, 9), y = R(3, 9); q = `${x} × ${y}`; a = x*y; } else { const y = R(2, 9), a2 = R(2, 9); q = `${y*a2} ÷ ${y}`; a = a2; } }
  const opts = new Set([a]); while (opts.size < 3){ const d = a + (Math.random() < .5 ? -1 : 1)*R(1, 4); if (d >= 0) opts.add(d); }
  return {q, a, opts: [...opts].sort(() => Math.random() - .5)};
}
function openGate(gt){
  G.state = "gate"; const Q = makeQ(G.lvl); G.gateQ = {gt, ...Q};
  panel(`<h2>LOCKED GATE!</h2><p>Solve it to open the gate:</p><div class="q">${Q.q} = ?</div>
    <div class="opts">${Q.opts.map((o, i) => `<button class="mbtn" data-o="${o}" type="button">${o}</button>`).join("")}</div>
    <p class="tiny">${touch ? "" : "PRESS 1, 2 OR 3 · ESC TO STEP BACK"}</p><button class="mbtn" id="gx" type="button" style="font-size:8px">STEP BACK</button>`);
  document.querySelectorAll("[data-o]").forEach(b => b.onclick = () => answer(+b.dataset.o, b));
  $("#gx").onclick = closeGate;
}
function answer(v, btn){
  if (G.state !== "gate") return;
  if (v === G.gateQ.a){
    SFX.ok(); const gt = G.gateQ.gt; gt.open = true; G.L.grid[gt.y][gt.x] = "."; G.L.grid[gt.y - 1][gt.x] = ".";
    addScore(200, gt.x*16, gt.y*16 - 16); burst(gt.x*16 + 8, gt.y*16 - 4, ["#ffd23a", "#fff", "#c08a4e"], 18);
    hidePanel(); G.state = "play";
  } else { SFX.bad(); const c = $("#panelCard"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); setTimeout(() => G.state === "gate" && openGate(G.gateQ.gt), 450); }
}
function closeGate(){ hidePanel(); G.state = "play"; G.gateCd = 1.2; G.p.x -= 4*Math.sign(G.p.facing || 1); }

/* ---------- input ---------- */
const K = {left: false, right: false, up: false, down: false, jumpQ: false, fireQ: false, jetQ: false};
const keyMap = {ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down"};
let upEdge = false;
addEventListener("keydown", e => {
  if (e.repeat && !keyMap[e.code]) return;
  audio();
  if (G.state === "gate"){ if (["Digit1", "Digit2", "Digit3"].includes(e.code)){ const b = document.querySelectorAll("[data-o]")[+e.code.slice(-1) - 1]; b && answer(+b.dataset.o, b); } if (e.code === "Escape") closeGate(); return; }
  if (keyMap[e.code]){ if (keyMap[e.code] === "up" && !K.up) upEdge = true; K[keyMap[e.code]] = true; e.preventDefault(); }
  if (e.code === "Space"){ K.jumpQ = true; e.preventDefault(); }
  if (e.code === "KeyX" || e.code === "ControlLeft" || e.code === "ControlRight" || e.code === "KeyJ") K.fireQ = true;
  if (e.code === "KeyZ" || e.code === "AltLeft" || e.code === "KeyL"){ K.jetQ = true; e.preventDefault(); }
  if (e.code === "Enter"){ if (G.state === "title" && $("#panel").hidden){ newGame(0); } else if (G.state === "card") startPlay(); else if (G.state === "walk") afterWalk(); }
  if (e.code === "KeyP" || e.code === "Escape") togglePause();
  if (e.code === "KeyM") $("#bMusic").click();
});
addEventListener("keyup", e => { if (keyMap[e.code]) K[keyMap[e.code]] = false; });
// game-pad
const dpad = $("#dpad"), dTouches = new Map();
function dpadUpdate(){
  let l = false, r = false, u = false, d = false;
  const rc = dpad.getBoundingClientRect(), cx = rc.left + rc.width/2, cy = rc.top + rc.height/2;
  for (const [, pt] of dTouches){ const dx = pt.x - cx, dy = pt.y - cy; if (Math.hypot(dx, dy) < 12) continue; const a = Math.atan2(dy, dx)*180/Math.PI;
    if (a > 112 || a < -112) l = true; if (a > -68 && a < 68) r = true; if (a < -22 && a > -158) u = true; if (a > 22 && a < 158) d = true; }
  if (u && !K.up) upEdge = !K.climbingHint;
  K.left = l; K.right = r; K.up = u; K.down = d;
  $("#dL").classList.toggle("on", l); $("#dR").classList.toggle("on", r); $("#dU").classList.toggle("on", u); $("#dD").classList.toggle("on", d);
}
dpad.addEventListener("pointerdown", e => { audio(); dpad.setPointerCapture(e.pointerId); dTouches.set(e.pointerId, {x: e.clientX, y: e.clientY}); dpadUpdate(); e.preventDefault(); });
dpad.addEventListener("pointermove", e => { if (dTouches.has(e.pointerId)){ dTouches.set(e.pointerId, {x: e.clientX, y: e.clientY}); dpadUpdate(); } });
for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) dpad.addEventListener(ev, e => { dTouches.delete(e.pointerId); dpadUpdate(); });
function padBtn(el, fn){ el.addEventListener("pointerdown", e => { audio(); e.preventDefault(); el.classList.add("down"); fn(); }); for (const ev of ["pointerup", "pointercancel", "pointerleave"]) el.addEventListener(ev, () => el.classList.remove("down")); }
padBtn($("#bJump"), () => { K.jumpQ = true; K.jumpHeld = true; }); $("#bJump").addEventListener("pointerup", () => K.jumpHeld = false);
padBtn($("#bFire"), () => K.fireQ = true);
padBtn($("#bJet"), () => K.jetQ = true);
// tap anywhere on the title / card to continue (touch)
$("#screen").addEventListener("pointerdown", e => { if (G.state === "card" && e.target.id !== "goBtn" && !e.target.closest(".mbtn")) startPlay(); else if (G.state === "walk" && G.walkT > 1) afterWalk(); });
function togglePause(){
  if (G.state === "play"){ G.state = "pause"; stopMusic(); panel(`<h2>PAUSED</h2><div class="menu"><button class="mbtn primary" id="rs" type="button">RESUME</button><button class="mbtn" id="hw" type="button">HOW TO PLAY</button><button class="mbtn" id="cr" type="button">CRT EFFECT: ${$("#crt").classList.contains("off") ? "OFF" : "ON"}</button><button class="mbtn" id="qt" type="button">QUIT TO TITLE</button></div>`);
    $("#rs").onclick = togglePause; $("#qt").onclick = showTitle; $("#hw").onclick = () => showHow(() => { G.state = "play"; togglePause(); });
    $("#cr").onclick = () => { $("#crt").classList.toggle("off"); store.set("dd_crt", !$("#crt").classList.contains("off")); $("#cr").textContent = `CRT EFFECT: ${$("#crt").classList.contains("off") ? "OFF" : "ON"}`; }; }
  else if (G.state === "pause"){ hidePanel(); G.state = "play"; startMusic(); }
}
$("#bPause").onclick = togglePause;
if (store.get("dd_crt", true) === false) $("#crt").classList.add("off");

/* ---------- update ---------- */
const DT = 1/120;
function update(dt){
  G.t += dt;
  if (G.state === "title"){ G.attract += dt; G.cam = (Math.sin(G.attract*.12)*.5 + .5)*(G.L.w*16 - VW); return; }
  if (G.state === "walk"){ G.walkT += dt; if (G.walkT > 3.4) afterWalk(); return; }
  if (G.state !== "play" && G.state !== "dead") return;
  const L = G.L, p = G.p;
  G.trainX += dt*70; if (G.trainX > 1400) G.trainX = -300 - Math.random()*600;
  // particles & pops
  for (const q of G.parts){ q.t -= dt; q.vy += 200*dt; q.x += q.vx*dt; q.y += q.vy*dt; } G.parts = G.parts.filter(q => q.t > 0);
  for (const q of G.pops){ q.t -= dt; q.y -= 18*dt; } G.pops = G.pops.filter(q => q.t > 0);
  if (G.state === "dead"){ G.deadT -= dt; if (G.deadT <= 0) respawn(); return; }
  G.inv = Math.max(0, G.inv - dt); G.fireCd -= dt; G.gateCd -= dt;
  // jetpack toggle / fire
  if (K.jetQ){ K.jetQ = false; if (p.hasJet && p.fuel > 0){ p.flying = !p.flying; p.climbing = false; if (p.flying) blip(300, .2, "sawtooth", .06, 1.6); } }
  if (K.fireQ){ K.fireQ = false; if (p.hasSling && G.fireCd <= 0){ G.fireCd = .32; SFX.shoot(); G.shots.push({x: p.x + (p.facing > 0 ? p.w : -6), y: p.y + 5, w: 6, h: 5, vx: p.facing*230, vy: 0, life: 1.1}); } }
  const onLadder = p.climbing || (typeof ladderAt === "function" && ladderAt(L, p));
  const inp = {left: K.left, right: K.right, up: K.up, down: K.down, jump: K.jumpQ || (upEdge && !onLadder && !p.flying)};
  K.jumpQ = false; upEdge = false;
  const wasGround = p.onGround;
  const r = stepPlayer(L, p, inp, dt);
  if (inp.jump && wasGround && !p.onGround && p.vy < 0) SFX.jump();
  if (p.flying && Math.random() < dt*30) G.parts.push({x: p.x + (p.facing > 0 ? 1 : p.w - 1), y: p.y + 13, vx: (Math.random() - .5)*20, vy: 40, t: .25, c: Math.random() < .5 ? "#ffb12a" : "#fff3a0"});
  if (r === "die") return die();
  // items
  const box = {x: p.x, y: p.y, w: p.w, h: p.h};
  for (const it of L.items){
    if (it.got) continue;
    if (aabb(box, {x: it.x*16 + 3, y: it.y*16 + 3, w: 10, h: 10})){
      it.got = true; const cx = it.x*16 + 8, cy = it.y*16 + 4;
      if (it.t === "T"){ G.trophy = true; SFX.trophy(); addScore(1000, cx, cy); setMsg("GO THROUGH THE DOOR!", true); burst(cx, cy, ["#ffd23a", "#fff3b0", "#c48a12"], 24, 90); }
      else if (it.t === "S"){ p.hasSling = true; SFX.life(); setMsg(touch ? "SLINGSHOT! TAP FIRE" : "SLINGSHOT! PRESS X TO FIRE", false); G.msgT = 4; hud(); }
      else if (it.t === "J"){ p.hasJet = true; p.fuel = 1; SFX.life(); setMsg(touch ? "JETPACK! TAP JET TO FLY" : "JETPACK! PRESS Z TO FLY", false); G.msgT = 4; hud(); }
      else if (it.t === "1"){ G.lives++; SFX.life(); hud(); G.pops.push({x: cx, y: cy, s: "+1", t: 1}); }
      else { (it.t === "x" ? SFX.coin : SFX.pick)(); addScore(ITEM_PTS[it.t], cx, cy); burst(cx, cy, ["#fff", "#ffd23a"], 6, 40); }
    }
  }
  if (G.msgT > 0){ G.msgT -= dt; if (G.msgT <= 0) setMsg(G.trophy ? "GO THROUGH THE DOOR!" : "FIND THE GOLDEN GHUMOT!", true); }
  // lamps (checkpoints)
  for (const lp of L.lamps) if (!lp.on && Math.abs(p.x + p.w/2 - (lp.x*16 + 8)) < 10 && Math.abs(p.y + p.h - (lp.y*16 + 16)) < 20){ lp.on = true; G.lamp = lp; SFX.lamp(); G.pops.push({x: lp.x*16 + 2, y: lp.y*16 - 20, s: "+0", t: .01}); setMsg("CHECKPOINT!", false); G.msgT = 1.6; }
  // gates
  if (G.gateCd <= 0) for (const gt of L.gates){ if (gt.open) continue; if (aabb({x: p.x - 2, y: p.y, w: p.w + 4, h: p.h}, {x: gt.x*16, y: gt.y*16 - 16, w: 16, h: 32})) { openGate(gt); return; } }
  // door
  if (L.door && aabb(box, {x: L.door.x*16 + 4, y: L.door.y*16 - 12, w: 8, h: 28})){
    if (G.trophy) return levelDone();
    if (G.msgT <= 0){ setMsg("FIND THE GOLDEN GHUMOT FIRST!", false); G.msgT = 1.5; }
  }
  // enemies & shots
  stepEnemies(L, dt, p, G.shots); stepShots(L, G.shots, dt);
  for (const s of G.shots){
    if (s.enemy){ if (G.inv <= 0 && aabb(box, s)) return die(); continue; }
    for (const e of L.enemies) if (e.alive && aabb(s, e)){ e.alive = false; s.life = 0; SFX.hit(); addScore({c: 100, w: 150, v: 200, y: 250}[e.t], e.x + 4, e.y); burst(e.x + 7, e.y + 5, ["#fff", "#aaa", "#e8402a"], 12); }
  }
  if (G.inv <= 0) for (const e of L.enemies) if (e.alive && aabb({x: p.x + 1, y: p.y + 2, w: p.w - 2, h: p.h - 2}, e)) return die();
  // camera
  const target = p.x + p.w/2 - VW/2 + p.facing*VW*.12;
  G.cam += (target - G.cam)*Math.min(1, dt*5);
  G.cam = Math.max(0, Math.min(L.w*16 - VW, G.cam));
  if (p.hasJet){ $("#hFuel").style.transform = `scaleX(${p.fuel})`; $("#bJet").classList.toggle("onjet", p.flying); }
}
function die(){
  if (G.state !== "play") return;
  G.state = "dead"; G.deadT = 1.5; SFX.die(); stopMusic();
  burst(G.p.x + 5, G.p.y + 8, ["#ffd23a", "#e8402a", "#fff", "#ef6a23"], 30, 110);
  G.lives--; hud();
}
function respawn(){
  if (G.lives <= 0) return gameEnd(false);
  const at = G.lamp ? {x: G.lamp.x, y: G.lamp.y} : G.L.start;
  const old = G.p; G.p = mkPlayer(G.L, at); G.p.hasSling = old.hasSling; G.p.hasJet = old.hasJet; G.p.fuel = Math.max(old.fuel, old.hasJet ? .35 : 0);
  G.shots = []; G.inv = 1.6; G.state = "play"; startMusic(); hud();
}

/* ---------- render ---------- */
function render(){
  ctx.imageSmoothingEnabled = false;
  const L = G.L; if (!L){ ctx.fillStyle = "#000"; ctx.fillRect(0, 0, VW, VH); return; }
  const cam = Math.round(G.cam), th = G.theme, [far, mid, near] = BG[th];
  const layer = (img, f, yOff = 0) => { const off = Math.floor(cam*f) % img.width; for (let x = -off; x < VW; x += img.width) ctx.drawImage(img, x, yOff); };
  layer(far, .12); layer(mid, .3);
  if (th === "falls"){ const tx = Math.round(G.trainX - cam*.3); ctx.drawImage(TRAIN, ((tx % 900) + 900) % 900 - 140, 82); }
  layer(near, .55, 0);
  // level tiles
  ctx.drawImage(G.levelCv, cam, 0, VW, VH, 0, 0, VW, VH);
  const x0 = Math.floor(cam/16), x1 = Math.min(L.w - 1, x0 + Math.ceil(VW/16) + 1), fr = Math.floor(G.t*6);
  for (let y = 0; y < L.h; y++) for (let x = x0; x <= x1; x++){
    const c = L.grid[y][x];
    if (c === "~") ART.waterTile(ctx, x*16 - cam, y*16, th, fr + x, y === 0 || L.grid[y - 1][x] !== "~");
    else if (c === "f") ART.fireTile(ctx, x*16 - cam, y*16, fr + x);
  }
  // door, lamps, gates
  if (L.door){ const dx = L.door.x*16 - cam, dy = L.door.y*16 - 16; ctx.drawImage(DOOR[G.trophy ? 1 : 0], dx, dy); if (G.trophy && Math.floor(G.t*4) % 2) { ctx.fillStyle = "#ffd23a"; ctx.fillRect(dx + 7, dy - 4, 2, 2); } }
  for (const lp of L.lamps) ctx.drawImage(LAMP[lp.on ? 1 : 0], lp.x*16 - cam, lp.y*16 - 16);
  for (const gt of L.gates) if (!gt.open) ctx.drawImage(GATE, gt.x*16 - cam, gt.y*16 - 16);
  // items (bobbing)
  for (const it of L.items){ if (it.got) continue; const sx = it.x*16 - cam; if (sx < -16 || sx > VW) continue;
    const bob = it.t === "T" ? Math.round(Math.sin(G.t*4)*2) : Math.round(Math.sin(G.t*3 + it.x)*1);
    const name = {k: "kaju", o: "kokum", m: "mango", b: "bebinca", x: "coin", T: "ghumot", "1": "oneup", S: "sling", J: "jetpack"}[it.t];
    if (it.t === "T" && Math.floor(G.t*8) % 4 === 0){ ctx.fillStyle = "#fff3b0"; ctx.fillRect(sx + 2 + Math.floor(Math.random()*12), it.y*16 + bob + Math.floor(Math.random()*12), 1, 1); }
    ctx.drawImage(ART.sprite(name), sx, it.y*16 + bob); }
  // enemies
  for (const e of L.enemies){ if (!e.alive) continue; const sx = Math.round(e.x - cam); if (sx < -20 || sx > VW + 4) continue;
    const f = Math.floor(G.t*6 + e.x0) % 2 + 1;
    const base = {c: "crab", w: "crow", v: "bat", y: "monkey"}[e.t];
    const flip = e.t === "w" ? e.vx < 0 : e.t === "y" ? e.vx < 0 : false;
    const oy = e.t === "c" ? -6 : e.t === "w" ? -4 : e.t === "v" ? -4 : -2;
    ctx.drawImage(ART.sprite(base + f, flip), sx - 1, Math.round(e.y) + oy); }
  // shots
  for (const s of G.shots) ctx.drawImage(ART.sprite(s.enemy ? "nut" : "pebble"), Math.round(s.x - cam) - 5, Math.round(s.y) - 7);
  // player
  const p = G.p;
  if (G.state === "dead"){ if (Math.floor(G.t*12) % 2) ctx.drawImage(ART.sprite("dev_die"), Math.round(p.x - cam) - 3, Math.round(p.y) - 1); }
  else if (!(G.inv > 0 && Math.floor(G.t*14) % 2)){
    let n = "dev_stand";
    if (p.flying) n = "dev_fly";
    else if (p.climbing) n = Math.floor(p.anim/6) % 2 ? "dev_climb1" : "dev_climb2";
    else if (!p.onGround) n = "dev_jump";
    else if (Math.abs(p.vx) > 1) n = ["dev_run1", "dev_run2", "dev_run3", "dev_run2"][Math.floor(p.anim/7) % 4];
    ctx.drawImage(ART.sprite(n, p.facing < 0 && !p.climbing), Math.round(p.x - cam) - 3, Math.round(p.y) - 1);
  }
  // particles & pops
  for (const q of G.parts){ ctx.fillStyle = q.c; ctx.fillRect(Math.round(q.x - cam), Math.round(q.y), 1 + (q.t > .4 ? 1 : 0), 1 + (q.t > .4 ? 1 : 0)); }
  for (const q of G.pops) if (q.s !== "+0") pixText(q.s, Math.round(q.x - cam), Math.round(q.y), Math.floor(G.t*10) % 2 ? "#ffd23a" : "#ffffff");
  // between-levels walk
  if (G.state === "walk"){
    ctx.fillStyle = "#06040c"; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = "#3a2b20"; ctx.fillRect(0, 150, VW, 6); ctx.fillStyle = "#a5482b"; ctx.fillRect(0, 156, VW, 36);
    for (let x = (-Math.floor(G.walkT*30) % 24); x < VW; x += 24){ ctx.fillStyle = "#c9693f"; ctx.fillRect(x, 160, 12, 2); }
    const wx = Math.round(-16 + (VW + 32)*(G.walkT/3.4));
    ctx.drawImage(ART.sprite(["dev_run1", "dev_run2", "dev_run3", "dev_run2"][Math.floor(G.walkT*10) % 4]), wx, 134);
    ctx.drawImage(ART.sprite("ghumot"), wx + 10, 128 + Math.round(Math.sin(G.walkT*10)));
  }
}

/* ---------- loop ---------- */
let last = performance.now(), acc = 0;
function frame(now){
  acc += Math.min(.1, (now - last)/1000); last = now;
  while (acc >= DT){ update(DT); acc -= DT; }
  render();
  requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange", () => { if (document.hidden && G.state === "play") togglePause(); });

/* ---------- boot ---------- */
layout(); prepArt(); showTitle(); hud();
$("#bMusic").style.opacity = musicOn ? 1 : .4;
requestAnimationFrame(frame);

</script>
</body>
