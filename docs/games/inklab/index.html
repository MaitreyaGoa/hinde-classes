<style>:root{--bg:#efe6d2;--panel:rgba(255,251,241,.94);--panel2:#fffaf0;--line:rgba(90,70,40,.2);--text:#2f2b24;--muted:#7a705f;--a1:#2f6fd6;--a2:#8b5cf6;--gold:#e8a91a;--red:#e0414f;--green:#1f9e6a;
  --f-disp:"Patrick Hand","Comic Sans MS",system-ui,sans-serif;--f:"Manrope",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--f);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.view{position:fixed;inset:0;display:none}.view.on{display:block}
/* backdrop */
.bgfx{position:fixed;inset:0;background:radial-gradient(1200px 600px at 15% -10%,rgba(124,240,255,.16),transparent 60%),radial-gradient(900px 600px at 110% 10%,rgba(185,164,255,.18),transparent 60%),radial-gradient(800px 500px at 50% 120%,rgba(255,207,90,.08),transparent 60%),#070a16}
.bgfx:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(140,160,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(140,160,255,.06) 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:1080px;margin:0 auto;position:relative}
/* top bar */
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex:none}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{background:var(--panel2)}.ib:active{transform:scale(.95)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:700;font-size:18px;letter-spacing:.2px}
.brand .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;box-shadow:0 6px 20px rgba(124,240,255,.3)}
.brand .logo svg{width:20px;height:20px;stroke:#0b1022;stroke-width:2.6;fill:none;stroke-linecap:round}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-weight:800;font-size:14px}
.pill .st{color:var(--gold)}
/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-bottom:22px}
.card{background:var(--panel);border-radius:22px;box-shadow:inset 0 0 0 1px var(--line),0 20px 50px rgba(0,0,0,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hcard{padding:26px;position:relative;overflow:hidden}
.hcard h1{font-family:var(--f-disp);font-size:clamp(28px,5vw,46px);line-height:1.05;margin:0 0 10px;letter-spacing:-.5px}
.hcard h1 em{font-style:normal;background:linear-gradient(90deg,var(--a1),var(--a2) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hcard p{color:var(--muted);margin:0 0 18px;line-height:1.5;max-width:46ch}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:16px;font-weight:800;font-size:16px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#0b1022;box-shadow:0 10px 30px rgba(124,240,255,.25)}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn:active{transform:translateY(1px)}
.hdemo{position:absolute;right:-30px;bottom:-30px;width:220px;opacity:.9;pointer-events:none}
.stats{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px;border-radius:16px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line)}
.stat b{display:block;font-family:var(--f-disp);font-size:24px}.stat small{color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--gold));border-radius:9px}
h2.sec{font-family:var(--f-disp);font-size:18px;margin:6px 2px 12px;display:flex;align-items:center;gap:10px}
h2.sec small{font-family:var(--f);color:var(--muted);font-weight:700;font-size:13px}
/* boards */
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bcard{padding:16px;text-align:left;border-radius:20px;position:relative;overflow:hidden;min-height:132px;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.bcard:hover{transform:translateY(-2px)}
.bcard .bn{font-weight:800;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.bcard .bt{font-family:var(--f-disp);font-size:17px;font-weight:700}
.bcard .bc{font-size:13px;color:var(--muted);flex:1}
.bcard .bico{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--g,linear-gradient(135deg,#7cf0ff,#b9a4ff))}
.bcard .bico svg{width:24px;height:24px;stroke:#0b1022;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bcard .bfoot{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}.bcard .bfoot .bar{flex:1;margin:0}
.bcard.lock{opacity:.5}.bcard.lock .bico{filter:grayscale(1)}
.bcard .new{position:absolute;left:14px;top:-1px;background:var(--gold);color:#0b1022;font-weight:900;font-size:10px;padding:3px 8px;border-radius:0 0 8px 8px;letter-spacing:.06em}
.bcard.bonus{box-shadow:inset 0 0 0 1px rgba(255,207,90,.45),0 20px 50px rgba(0,0,0,.25)}
/* level grid */
.bhead{padding:20px;margin-bottom:16px;display:flex;gap:16px;align-items:center}
.bhead .bico{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;flex:none;background:var(--g)}
.bhead .bico svg{width:30px;height:30px;stroke:#0b1022;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bhead h2{margin:0 0 4px;font-family:var(--f-disp);font-size:22px}.bhead p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.lv{aspect-ratio:1.1;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--f-disp);font-size:22px;font-weight:700;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);position:relative}
.lv .stars{font-size:13px;letter-spacing:1px;color:rgba(255,255,255,.18)}.lv .stars i{font-style:normal}.lv .stars i.on{color:var(--gold);text-shadow:0 0 10px rgba(255,207,90,.5)}
.lv.done{background:linear-gradient(160deg,rgba(124,240,255,.14),rgba(185,164,255,.12));box-shadow:inset 0 0 0 1px rgba(124,240,255,.35)}
.lv.lock{opacity:.35}.lv.next{box-shadow:inset 0 0 0 2px var(--a1),0 0 24px rgba(124,240,255,.25)}
.lv small{position:absolute;top:8px;left:10px;font-family:var(--f);font-size:10px;font-weight:800;color:var(--muted)}
.ltip{color:var(--muted);font-size:13px;margin:12px 4px}
/* play */
#play{background:#060914;touch-action:none}
#cv{position:absolute;inset:0;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));pointer-events:none}
.hud>*{pointer-events:auto}
.obj{flex:1;display:flex;justify-content:center;pointer-events:none}
.obj div{background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:9px 16px;border-radius:14px;font-weight:800;font-size:clamp(13px,1.9vw,17px);text-align:center;max-width:60vw;line-height:1.25}
.obj div small{display:block;font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.hgrp{display:flex;gap:6px}
.chip{height:42px;padding:0 12px;border-radius:14px;display:flex;align-items:center;gap:6px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.chip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4}
.chip.bad{color:var(--muted)}
.goals{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:6px;pointer-events:none;flex-wrap:wrap}
.goals span{padding:6px 10px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-size:12px;font-weight:800;color:var(--muted)}
.goals span b{color:var(--gold)}.goals span.miss{text-decoration:line-through;opacity:.6}
.holdring{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);width:92px;height:92px;pointer-events:none;opacity:0;transition:opacity .2s}
.holdring.on{opacity:1}.holdring svg{width:100%;height:100%;transform:rotate(-90deg)}
.holdring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-size:32px;color:var(--green);text-shadow:0 0 20px rgba(61,220,151,.6)}
.toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{opacity:1}
/* modals */
.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(4,6,14,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;padding:16px}
.modal.on{display:grid}
.mbox{width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.mbox h3{font-family:var(--f-disp);font-size:26px;margin:4px 0 6px}
.mbox p{color:var(--muted);line-height:1.5;margin:6px 0}
.bigstars{display:flex;justify-content:center;gap:10px;margin:8px 0 10px}
.bigstars i{font-style:normal;font-size:46px;color:rgba(255,255,255,.12);transform:scale(.4);opacity:0;transition:all .4s cubic-bezier(.2,1.6,.4,1)}
.bigstars i.on{color:var(--gold);text-shadow:0 0 24px rgba(255,207,90,.6)}.bigstars i.show{transform:scale(1);opacity:1}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.mstats div{padding:10px;border-radius:14px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line)}
.mstats b{display:block;font-family:var(--f-disp);font-size:18px}.mstats small{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.idea{margin:12px 0 4px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(124,240,255,.1),rgba(185,164,255,.1));box-shadow:inset 0 0 0 1px rgba(124,240,255,.25);text-align:left;font-size:14px;line-height:1.45}
.idea b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--a1);margin-bottom:3px}
.mact{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.concept .cico{width:78px;height:78px;margin:0 auto 6px;border-radius:24px;display:grid;place-items:center;background:var(--g)}
.concept .cico svg{width:42px;height:42px;stroke:#0b1022;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.concept .tag{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.formula{font-family:var(--f-disp);font-size:15px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.25);margin:10px 0;color:#e4ff7a}
.how{display:grid;gap:8px;text-align:left;margin:12px 0}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--text);line-height:1.4}
.how div i{font-style:normal;flex:none;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:rgba(124,240,255,.14);color:var(--a1);font-weight:900;font-size:13px}
.rotate{position:fixed;inset:auto 12px max(12px,env(safe-area-inset-bottom)) 12px;z-index:5;display:none;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:700}
.rotate svg{width:26px;height:26px;stroke:var(--a1);fill:none;stroke-width:2;flex:none;animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

@media (max-width:760px){.hero{grid-template-columns:1fr}.levels{grid-template-columns:repeat(4,1fr)}.hdemo{width:150px}}
@media (max-width:420px){.levels{grid-template-columns:repeat(3,1fr)}.boards{grid-template-columns:1fr 1fr}.bcard{min-height:150px;padding:14px}.bcard .bico{width:36px;height:36px}.bcard .bt{font-size:15px;padding-right:30px}}
@media (max-height:500px){.hud .chip,.hud .ib{height:36px}.hud .ib{width:36px}.obj div{padding:6px 12px}.holdring{width:70px;height:70px}}

/* ===== sketchbook theme: warm paper, pencil lines, easy on the eyes ===== */
.bgfx{background:#f3ebd9}
.bgfx:after{background-image:linear-gradient(rgba(90,130,190,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(90,130,190,.12) 1px,transparent 1px);background-size:28px 28px;mask-image:none;opacity:.9}
.bgfx:before{content:"";position:absolute;top:0;bottom:0;left:max(18px,calc(50% - 560px));width:2px;background:rgba(224,65,79,.25)}
.card{box-shadow:inset 0 0 0 1.5px var(--line),0 10px 26px rgba(90,70,30,.12);backdrop-filter:none;-webkit-backdrop-filter:none}
.ib,.chip,.pill,.obj div,.goals span{backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:inset 0 0 0 1.5px var(--line),0 2px 6px rgba(90,70,30,.1)}
.ib:hover{background:#fff}
.btn{color:#fff;box-shadow:0 5px 0 rgba(40,60,120,.25),0 10px 22px rgba(47,111,214,.2);font-family:var(--f-disp);font-size:20px;font-weight:400}
.btn.ghost{color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line),0 4px 0 rgba(90,70,30,.12)}
.hcard h1,.mbox h3,.bhead h2,.bcard .bt,h2.sec,.brand,.stat b,.mstats b,.lv,.holdring b{font-weight:400;letter-spacing:0}
.hcard h1{font-size:clamp(34px,6vw,56px)}
.stat,.mstats div{background:rgba(255,255,255,.6)}
.bar{background:rgba(90,70,40,.12)}
.lv .stars{color:rgba(90,70,40,.22)}.lv .stars i.on{text-shadow:none}
.lv{font-size:28px}
.lv.done{background:linear-gradient(160deg,rgba(47,111,214,.10),rgba(139,92,246,.10));box-shadow:inset 0 0 0 1.5px rgba(47,111,214,.35)}
.lv.next{box-shadow:inset 0 0 0 2.5px var(--a1),0 6px 18px rgba(47,111,214,.2)}
.bcard.bonus{box-shadow:inset 0 0 0 1.5px rgba(232,169,26,.6),0 10px 26px rgba(90,70,30,.12)}
#play{background:#e6d9bc}
.obj div{font-family:var(--f-disp);font-size:clamp(17px,2.4vw,22px);font-weight:400}
.obj div small{font-family:var(--f)}
.modal{background:rgba(70,55,30,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.bigstars i{color:rgba(90,70,40,.15)}.bigstars i.on{text-shadow:0 2px 0 rgba(150,100,0,.25)}
.formula{background:rgba(31,158,106,.10);color:#1d6b4b;font-size:20px}
.idea{background:linear-gradient(135deg,rgba(47,111,214,.08),rgba(139,92,246,.08));box-shadow:inset 0 0 0 1.5px rgba(47,111,214,.22)}
.how div i{background:rgba(47,111,214,.12)}
.holdring b{text-shadow:none}
.toast{background:#fffaf0;box-shadow:inset 0 0 0 1.5px var(--line),0 6px 18px rgba(90,70,30,.18)}

/* phone held upright: show the game sideways (landscape) */
body.rot #play.on,body.rot .modal{position:fixed;top:0;left:var(--vw,100vw);right:auto;bottom:auto;width:var(--vh,100vh);height:var(--vw,100vw);transform:rotate(90deg);transform-origin:0 0}
body.rot .rotate{display:none!important}
body.rot .hud .chip,body.rot .hud .ib{height:36px}body.rot .hud .ib{width:36px}body.rot .obj div{padding:5px 12px}body.rot .holdring{width:70px;height:70px}body.rot .goals span{padding:4px 9px}
.goals span.go{color:var(--a1);background:#fffaf0}

<script>/* InkLab physics engine. Shared by the browser game and the level checker (node).
   World: x 0..16, y 0..9 (metres, y up). Needs the global `planck`. */
(function (root) {
  const pl = root.planck || (typeof require !== "undefined" ? require("planck") : null);
  const V = (x, y) => pl.Vec2(x, y);
  const W = 16, H = 9, DT = 1 / 60, THICK = 0.14, HOLD = 3;
  const MATS = {
    def:   {density: 1,   friction: 0.6,  restitution: 0.1},
    ink:   {density: 1,   friction: 0.6,  restitution: 0.1},
    ball:  {density: 1.5, friction: 0.5,  restitution: 0.2},
    steel: {density: 6,   friction: 0.4,  restitution: 0.15},
    metal: {density: 3,   friction: 0.4,  restitution: 0.15},
    wood:  {density: 0.6, friction: 0.7,  restitution: 0.1},
    ice:   {density: 1,   friction: 0.0,  restitution: 0.05},
    rubber:{density: 1.2, friction: 2.0,  restitution: 0.3},
    bouncy:{density: 1,   friction: 0.5,  restitution: 1.0},
    light: {density: 0.25,friction: 0.6,  restitution: 0.2},
  };
  const deg = a => (a || 0) * Math.PI / 180;

  function create(L) {
    const world = new pl.World({gravity: V(0, -10)});
    const G = {L, world, t: 0, by: {}, inks: [], pins: [], shapes: 0, hold: 0, won: false, wonAt: null, fails: 0,
               fields: [], portals: [], bombs: [], buttons: [], gates: [], movers: [], spinners: [], conveyors: [], magnets: [], waters: [], fans: [], gzones: [],
               ever: {}, contacts: new Map(), events: [], drawn: false, tapped: false};
    const ground = world.createBody(); G.ground = ground;

    const fixOpts = (mat, extra) => Object.assign({}, MATS[mat] || MATS.def, extra || {});
    const mk = (o, type, x, y, a) => {
      const b = world.createBody({type, position: V(x, y), angle: deg(a), bullet: o.k === "ball" && type === "dynamic", allowSleep: true});
      b.setUserData({o, kind: o.k, id: o.id, color: o.color, mat: o.mat});
      if (o.id) G.by[o.id] = b;

    const thickLine = (b, pts, th, mat, ox, oy) => {
      for (let i = 0; i < pts.length - 1; i++) {
        const [x1, y1] = pts[i], [x2, y2] = pts[i + 1], L2 = Math.hypot(x2 - x1, y2 - y1);

      const ty = type(o);

        case "box": { const b = mk(o, o.dyn === false ? "static" : o.kin ? "kinematic" : "dynamic", o.x, o.y, o.a);

        case "poly": { const b = mk(o, o.dyn ? "dynamic" : "static", 0, 0);

        case "wall": { const b = mk(o, o.dyn ? "dynamic" : "static", 0, 0); (o.lines || [o.pts]).forEach(pts => thickLine(b, pts, o.th || 0.2, o.mat || "def", 0, 0));

        case "cup": { // open-top container; (x,y) = bottom centre
          const b = mk(o, o.dyn === false ? "static" : "dynamic", o.x, o.y, o.a), w = o.w, h = o.h, t = o.th || 0.14, m = o.mat || "def";
          b.createFixture(pl.Box(w / 2, t / 2, V(0, t / 2), 0), fixOpts(m));
          b.createFixture(pl.Box(t / 2, h / 2, V(-w / 2 + t / 2, h / 2), 0), fixOpts(m));
          b.createFixture(pl.Box(t / 2, h / 2, V(w / 2 - t / 2, h / 2), 0), fixOpts(m)); break; }
        case "conveyor": { const b = mk(o, "static", o.x, o.y, o.a); b.createFixture(pl.Box(o.w / 2, (o.h || 0.3) / 2), fixOpts("rubber")); G.conveyors.push(b); break; }
        case "pad": { const b = mk(o, "static", o.x, o.y, o.a); b.createFixture(pl.Box(o.w / 2, (o.h || 0.2) / 2), fixOpts("bouncy")); break; }
        case "bomb": { const b = mk(o, o.dyn ? "dynamic" : "static", o.x, o.y); b.createFixture(pl.Circle(o.r || 0.32), fixOpts("def")); G.bombs.push({b, o, live: true}); break; }
        case "button": { const b = mk(o, "static", o.x, o.y); b.createFixture(pl.Box(o.w / 2, 0.08), fixOpts("def")); G.buttons.push({b, o, on: false}); break; }
        case "gate": { const b = mk(o, "kinematic", o.x, o.y); b.createFixture(pl.Box(o.w / 2, o.h / 2), fixOpts("def")); G.gates.push({b, o, open: false, y0: o.y}); break; }
        case "water": G.waters.push(o); break;
        case "fan": G.fans.push(o); break;
        case "magnet": { G.magnets.push(o); const b = mk(o, "static", o.x, o.y); b.createFixture(pl.Circle(0.42), {density: 1, friction: 1.5, restitution: 0}); break; }

        case "portal": G.portals.push({o, cool: new Map()}); break;

<script>const BOARDS=[{"name":"Falling Lines","icon":"gravity","concept":{"title":"Gravity","text":"Everything you draw is pulled down by gravity, just like a real object. Lines fall, tip over, slide down slopes and roll. Use that to push, block and carry things.","formula":"Weight = mass × g  (g ≈ 9.8 m/s²)"},"bonus":false},{"name":"Levers & Weight","icon":"lever","concept":{"title":"Levers","text":"A see-saw turns around its pivot. The side with the bigger turning effect (torque) goes down. Drop a heavy shape on one end and the other end flies up: a catapult.","formula":"Torque = weight × distance from the pivot"},"bonus":false},{"name":"Cups & Balance","icon":"cup","concept":{"title":"Centre of mass","text":"Every object balances around its centre of mass. While that point is above the base, it stands. Push it past the edge of the base and it tips over.","formula":"Stable when the centre of mass is above the base"},"bonus":false},{"name":"No-Draw Zones","icon":"nodraw","concept":{"title":"Plan ahead","text":"You can't draw inside red zones, but objects can still move through them. Draw somewhere else and let gravity, slopes and levers carry your shape into place.","formula":"Think: where will my shape end up?"},"bonus":false},{"name":"Pins & Pivots","icon":"pin","concept":{"title":"Pins & pivots","text":"Tap on a shape you have drawn to pin it to the wall. With one pin it can still turn around that point, like a hammer or a pendulum. With two pins it is locked in place.","formula":"1 pin = turns around a pivot · 2 pins = fixed","how":["Draw a shape.","Tap on the shape to drop a pin there.","A pinned shape swings around the pin under gravity."]},"bonus":false},{"name":"Wheels & Windmills","icon":"wheel","concept":{"title":"Rotation","text":"Wheels and windmills turn around an axle. A push far from the axle turns them more easily. Motors keep some of them spinning by themselves, and anything that touches them gets carried along.","formula":"Turning effect = force × distance from the axle"},"bonus":false},{"name":"Collisions","icon":"collide","concept":{"title":"Momentum","text":"Moving things carry momentum. When they hit something, they pass some of it on. A heavy, fast object hits hardest, and one hit can start a whole chain.","formula":"Momentum = mass × velocity"},"bonus":false},{"name":"Ropes & Pendulums","icon":"rope","concept":{"title":"Pendulums","text":"Something hanging on a rope swings like a pendulum. Push it and it swings up the other side, slowing down as it climbs. A rope can pull but never push.","formula":"Higher swing needs more energy: speed at the bottom becomes height"},"bonus":false},{"name":"Bounce","icon":"bounce","concept":{"title":"Bouncing","text":"Pink pads are super bouncy: things bounce off them almost as fast as they hit. A ball bounces off at the same angle it came in, like light off a mirror.","formula":"Angle in = angle out"},"bonus":false},{"name":"Ice & Rubber","icon":"ice","concept":{"title":"Friction","text":"Friction is the grip between two surfaces. On blue ice there is almost none, so things slide a long way. On orange rubber there is lots, so things stop quickly and don't slide down slopes.","formula":"Friction force = μ × weight   (μ ice ≈ 0, μ rubber ≈ 2)"},"bonus":false},{"name":"Conveyors & Lifts","icon":"conveyor","concept":{"title":"Moving surfaces","text":"Conveyor belts carry whatever sits on them, and lifts move up and down by themselves. Things riding on them move with them: that's relative motion.","formula":"Your speed = the belt's speed + your speed on the belt"},"bonus":false},{"name":"Wind","icon":"wind","concept":{"title":"Air pushes","text":"Fans blow moving air. The air drags things along, and light, wide shapes get pushed far more than small heavy ones. Air can even hold a shape up against gravity.","formula":"Air drag grows with size and with the difference in speed"},"bonus":false},{"name":"Water","icon":"water","concept":{"title":"Floating & sinking","text":"Water pushes up on anything in it. Things lighter than water for their size, like wood and your drawn shapes, float. Heavy things like steel sink. Water also slows everything down.","formula":"Upthrust = weight of the water pushed aside (Archimedes)"},"bonus":false},{"name":"Magnets","icon":"magnet","concept":{"title":"Magnetism","text":"Magnets pull on metal (the grey balls), but not on wood, rubber or your drawn shapes. The pull gets much stronger as the metal gets closer, and out of range there's no pull at all.","formula":"Pull ∝ 1 / distance²"},"bonus":false},{"name":"Gravity Zones","icon":"space","concept":{"title":"Changing gravity","text":"Inside a purple zone gravity is different: weaker like on the Moon, reversed so things fall upwards, or even sideways. Objects follow the gravity of wherever they are right now.","formula":"Weight = mass × g, and g changes from zone to zone"},"bonus":false},{"name":"Explosions","icon":"bomb","concept":{"title":"Impulse","text":"A bomb goes off when anything moving touches it. The blast gives everything nearby a sudden push (an impulse). Closer things get pushed harder, and light things fly further.","formula":"Impulse = force × time = change in momentum"},"bonus":true},{"name":"Portals","icon":"portal","concept":{"title":"Conservation of momentum","text":"Anything that goes into the orange portal comes out of the blue one (and the other way), moving at exactly the same speed. Height gained through a portal turns into extra speed when it falls again.","formula":"Speed in = speed out"},"bonus":true},{"name":"Machines","icon":"switch","concept":{"title":"Cause and effect","text":"Red buttons open yellow gates. Anything that lands on a button presses it. Chain your ideas from every board into a machine: one action causes the next.","formula":"Action → reaction → … → goal"},"bonus":true}];const LEVELS=[{"id":"b01-1a","board":0,"idx":0,"title":"Draw any shape","idea":"Anything you draw becomes a solid object with weight.","objs":[{"       <p class="ltip">Levels open in groups of 5. Solve 3 in a group to open the next group.</p>`;
    $("#bTitle").textContent = `Board ${i + 1}`;
    $$(".lv").forEach(b => b.onclick = () => { const l = LEVELS.find(x => x.id === b.dataset.l); if (!levelOpen(l)) return toast("Solve 3 levels in the group above first", "#boardToast"); openLevel(l); });
    show("board"); }

  /* ---------- play ---------- */
  let L = null, G = null, R = null, raf = 0, acc = 0, last = 0, fxl = [], drawing = null, hintOn = 0, holdShown = false, lastTick = 0;
  const cv = $("#cv");
  function openLevel(l) {
    L = l; curBoard = l.board; $("#lvNo").textContent = `${l.board + 1}-${l.idx + 1}`; $("#objT").innerHTML = `<small>Level ${l.board + 1}-${l.idx + 1}</small>${l.title}`;
    if (!(history.state && history.state.inkPlay)) try { history.pushState({inkPlay: 1}, ""); } catch (e) {}
    wantLandscape(); show("play"); R = R || INKR.make(cv); resize(); restart();
    if (l.idx === 0 && !save.seen[l.board]) concept(l.board); else if (l.board === 0 && l.idx === 0 && !save.seen.howto) concept(0);
  }
  function restart() { $("#gP").hidden = !L.pins; $("#gGo").hidden = false; G = INK.create(L); G.started = false; fxl = []; drawing = null; hintOn = 0; holdShown = false; updateHud(); startLoop(); $("#holdR").classList.remove("on"); closeModal(); }
  function resize() { applyRot(); if (!R) return; const W = rot ? innerHeight : innerWidth, H = rot ? innerWidth : innerHeight, top = H < 520 ? 48 : 60; R.fit(W, H, top, H < 520 ? 0 : 34); }
  addEventListener("resize", () => setTimeout(resize, 60)); addEventListener("orientationchange", () => setTimeout(resize, 250));
  function startLoop() { stopLoop(); last = performance.now(); acc = 0; raf = requestAnimationFrame(loop); }
  function stopLoop() { cancelAnimationFrame(raf); raf = 0; }
  function loop(now) { raf = requestAnimationFrame(loop); const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (G.started && !$("#winM").classList.contains("on") && !$("#conceptM").classList.contains("on")) { acc += dt; while (acc >= INK.DT) { INK.step(G); acc -= INK.DT; G.events.splice(0).forEach(e => { fxl.push({...e, t0: G.t}); if (e.k === "boom") sfx.boom(); }); if (G.won) break; } }
    if (fxl.length > 30) fxl = fxl.filter(e => G.t - e.t0 < 1);
    R.frame(G, {fx: fxl, preview: drawing && drawing.pts, ghost: hintOn > G.t ? L.sol : null}); updateHud();
    if (G.won && !G.shownWin) { G.shownWin = true; setTimeout(win, 350); } }
  function updateHud() {
    $("#tmr").textContent = fmtT(G ? (G.wonAt || G.t) : 0); $("#shp").textContent = G ? G.shapes : 0;
    const p = L && G ? Math.min(1, G.hold / (L.hold ?? INK.HOLD)) : 0, ring = $("#holdR");
    if (L && G && !L.goal.survive && p > 0 && !G.won) { ring.classList.add("on"); $("#holdC").style.strokeDashoffset = 264 * (1 - p); const left = Math.ceil((L.hold ?? INK.HOLD) * (1 - p)); $("#holdN").textContent = left || "✓";
      if (left !== lastTick) { lastTick = left; sfx.tick(); } }
    else if (L && G && L.goal.survive && G.shapes && !G.failed && !G.won) { ring.classList.add("on"); $("#holdC").style.strokeDashoffset = 264 * (1 - p); $("#holdN").textContent = Math.ceil(L.goal.survive - G.t); }
    else ring.classList.remove("on");
    if (L) { const sOk = !G || G.shapes <= L.par.shapes, tOk = !G || G.t <= L.par.time;
      $("#gS").className = sOk ? "" : "miss"; $("#gT").className = tOk ? "" : "miss"; $("#gS").innerHTML = `<b>★</b> ${L.par.shapes} shape${L.par.shapes > 1 ? "s" : ""}`; $("#gT").innerHTML = `<b>★</b> under ${L.par.time}s`; }
    if (L && G && L.goal.survive && G.failed && !G.failToast) { G.failToast = true; toast("Oops! Tap restart and try again", "#playToast"); } }
  // drawing input
  const wpt = e => { if (rot) return R.toWorld(e.clientY, innerWidth - e.clientX); const r = cv.getBoundingClientRect(); return R.toWorld(e.clientX - r.left, e.clientY - r.top); };
  cv.addEventListener("pointerdown", e => { if (G.won) return; if (!G.started) { G.started = true; $("#gGo").hidden = true; } cv.setPointerCapture(e.pointerId); const p = wpt(e);
    if (INK.blockedAt(G, p[0], p[1])) { const u = L.pins && INK.pinAt(G, p); if (u && u.ok) { sfx.pin(); return; } fxl.push({k: "block", x: p[0], y: p[1], t0: G.t}); sfx.block(); drawing = null; return; }
    drawing = {pts: [p], t0: performance.now(), stop: false, len: 0}; });
  cv.addEventListener("pointermove", e => { if (!drawing || drawing.stop) return; const p = wpt(e), q = drawing.pts[drawing.pts.length - 1]; if (Math.hypot(p[0] - q[0], p[1] - q[1]) < 0.04) return;
    const c = INK.clip(G, q, p); if (c.pt) { drawing.len += Math.hypot(c.pt[0] - q[0], c.pt[1] - q[1]); drawing.pts.push(c.pt); } if (c.stop) { drawing.stop = true; const b = c.pt || q; fxl.push({k: "block", x: b[0], y: b[1], t0: G.t}); sfx.block(); } });
  const finish = e => { if (!drawing) return; const d = drawing; drawing = null; const quick = performance.now() - d.t0 < 350;
    if (d.len < 0.2 && quick) { if (L.pins && INK.pinAt(G, d.pts[0]).ok) { sfx.pin(); return; } const r = INK.addDot(G, d.pts[0]); if (r.ok) sfx.draw(); return; }
    if (d.len < 0.12) return; INK.addStroke(G, INK.densify(d.pts)); sfx.draw(); };
  cv.addEventListener("pointerup", finish); cv.addEventListener("pointercancel", finish);
  $("#bRestart").onclick = () => restart();
  $("#bHint").onclick = () => { hintOn = G.t + 5; toast(L.sol.length > 1 ? `Hint: ${L.sol.length} shapes, drawn in the numbered order` : "Hint: draw the dashed shape", "#playToast"); };
  $("#bBack").onclick = () => { if (history.state && history.state.inkPlay) history.back(); else openBoard(L.board); };
  addEventListener("popstate", () => { if ($("#play").classList.contains("on")) openBoard(L.board); });
  $("#bSnd").onclick = () => { save.mute = !save.mute; store(); sndIcon(); };
  const sndIcon = () => { $("#bSnd").innerHTML = save.mute ? '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M23 9l-6 6M17 9l6 6"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>'; }; sndIcon();
  addEventListener("keydown", e => { if (!$("#play").classList.contains("on")) return; if (e.key === "r" || e.key === "R") restart(); if (e.key === "Escape") $("#bBack").click(); });

  function win() {
    const t = G.wonAt, s = G.shapes, stars = 1 + (s <= L.par.shapes ? 1 : 0) + (t <= L.par.time ? 1 : 0), prev = lvlState(L.id);
    save.lv[L.id] = {stars: Math.max(stars, prev ? prev.stars : 0), t: Math.min(t, prev ? prev.t : 1e9), s: Math.min(s, prev ? prev.s : 1e9)}; store();
    sfx.win(); const i = LEVELS.indexOf(L), nxt = LEVELS.slice(i + 1).find(levelOpen);
    $("#winBody").innerHTML = `<h3>${stars === 3 ? "Perfect!" : stars === 2 ? "Great solve!" : "Solved!"}</h3>
      <div class="bigstars">${[1, 2, 3].map(k => `<i class="${stars >= k ? "on" : ""}">★</i>`).join("")}</div>
      <div class="mstats"><div><b>${fmtT(t)}</b><small>time</small></div><div><b>${s}</b><small>shapes</small></div><div><b>${L.par.shapes} · ${L.par.time}s</b><small>★ targets</small></div></div>
      <div class="idea"><b>Physics idea</b>${L.idea}</div>
      <div class="mact"><button class="btn ghost" id="wRe">Replay</button>${nxt ? `<button class="btn" id="wNext">Next level</button>` : `<button class="btn" id="wBoard">Boards</button>`}</div>`;
    openModal("#winM"); $$("#winM .bigstars i").forEach((el, k) => setTimeout(() => { el.classList.add("show"); if (el.classList.contains("on")) sfx.star(k); }, 250 + k * 220));
    $("#wRe").onclick = () => restart(); if (nxt) $("#wNext").onclick = () => { closeModal(); nxt.board !== L.board ? (home(), openLevel(nxt)) : openLevel(nxt); }; else $("#wBoard").onclick = () => { closeModal(); home(); };
  }
  function concept(b) { const B = BOARDS[b]; save.seen[b] = true; if (b === 0) save.seen.howto = true; store();
    $("#conceptBody").innerHTML = `<div class="cico" style="--g:${g(b)}">${svg(B.icon)}</div><span class="tag">${b ? "New physics" : "Welcome to InkLab"}</span><h3>${B.concept.title}</h3><p>${B.concept.text}</p>
      ${B.concept.formula ? `<div class="formula">${B.concept.formula}</div>` : ""}
      ${B.concept.how ? `<div class="how">${B.concept.how.map((h, k) => `<div><i>${k + 1}</i><span>${h}</span></div>`).join("")}</div>` : ""}
      ${b === 0 ? `<div class="how"><div><i>1</i><span>Draw with your finger or mouse. When you lift, the shape becomes solid and falls.</span></div><div><i>2</i><span>You can't draw through objects or inside red zones.</span></div><div><i>3</i><span>Reach the goal and keep it for 3 seconds. Use fewer shapes and less time to earn ★★★.</span></div></div>` : ""}
      <div class="mact"><button class="btn" id="cOk">Let's go</button></div>`;
    openModal("#conceptM"); $("#cOk").onclick = () => { closeModal(); last = performance.now(); }; }
  function openModal(s) { $$(".modal").forEach(m => m.classList.remove("on")); $(s).classList.add("on"); }
  function closeModal() { $$(".modal").forEach(m => m.classList.remove("on")); }
  let tt = 0; function toast(m, sel = "#playToast") { const t = $(sel); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }

  $("#bHome").onclick = () => home(); $("#bHome2").onclick = () => home();
  // deep links: #level-3-7 ; unlock code for teachers/testing
  const h = location.hash.match(/^#level-(\d+)-(\d+)$/);
  if (/[?&]unlock=physics/.test(location.search)) { save.all = true; store(); }
  home(); if (h) { const l = LEVELS.find(x => x.board === +h[1] - 1 && x.idx === +h[2] - 1); if (l && levelOpen(l)) openLevel(l); }
  window.__ink = {openLevel: id => openLevel(LEVELS.find(l => l.id === id)), get G() { return G; }, get L() { return L; }, save};
})();
</script></body></html>
