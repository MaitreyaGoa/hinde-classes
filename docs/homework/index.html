<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Task Portal – Hinde Classes</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, modern, friendly – a student and parent see exactly what to do next; the teacher sees everyone at a glance
   IDEA: frosted-glass bento board – every student (and every fact) is a tile on one board
   PICTURE: soft teal/coral/gold light behind frosted tiles; the current worksheet is the biggest tile
   COLOUR and TYPE: Hinde teal #0B4F4A dominant, coral #FF6B54 accent, gold #E0A93B support; Poppins headings, Inter body
   LAYOUT: 6-column bento on wide screens, 2 columns on tablets, single column on phones */
:root{color-scheme:light;--ink:#12302d;--mute:#4f6764;--teal:#0B4F4A;--teal2:#0e7b72;--coral:#FF6B54;--gold:#E0A93B;
--glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.78);--edge:rgba(255,255,255,.75);--line:rgba(11,79,74,.12);
--ok:#1b8a4b;--okbg:rgba(31,138,76,.14);--sub:#2463a6;--subbg:rgba(36,99,166,.13);--redo:#9a6b12;--redobg:rgba(224,169,59,.2);--bad:#c2452f;--badbg:rgba(194,69,47,.13);--pend:#5f7270;--pendbg:rgba(95,114,112,.12)}
*{box-sizing:border-box;min-width:0}
html{min-height:100%;background:#eaf3f1}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;
  background:
    radial-gradient(60vw 60vw at 8% 0%,rgba(14,123,114,.35),transparent 60%),
    radial-gradient(50vw 50vw at 100% 10%,rgba(255,107,84,.28),transparent 60%),
    radial-gradient(60vw 50vw at 60% 100%,rgba(224,169,59,.28),transparent 60%),
    linear-gradient(160deg,#eef7f5,#f8f3ea);background-attachment:fixed}
h1,h2,h3,.brand,.btn{font-family:Poppins,system-ui,sans-serif}
a{color:var(--teal2)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--edge);border-radius:22px;box-shadow:0 10px 30px rgba(11,79,74,.10),inset 0 1px 0 rgba(255,255,255,.7)}
header{position:sticky;top:0;z-index:5;margin:10px max(3vw,10px) 0;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:18px}
.brand{font-weight:700;font-size:17px;color:var(--teal);margin-right:auto;letter-spacing:.4px}
.brand small{display:block;font:500 12px Inter,sans-serif;color:var(--mute);letter-spacing:0}
.who{font-size:14px;font-weight:600}
.pill{border:1px solid var(--line);background:var(--glass2);color:var(--teal);border-radius:999px;padding:8px 14px;font:600 14px Inter,sans-serif;cursor:pointer;min-height:38px;text-decoration:none}
nav{display:flex;gap:6px;flex-wrap:wrap;width:100%}
nav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--teal);font:600 14px Inter,sans-serif;background:rgba(255,255,255,.45);border:1px solid var(--edge)}
nav a.on{background:var(--teal);color:#fff;border-color:var(--teal)}
main{max-width:1180px;margin:0 auto;padding:18px max(3vw,10px) 48px}
.bento{display:grid;gap:14px;grid-template-columns:repeat(6,minmax(0,1fr))}
.tile{padding:18px;min-height:120px}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:1/-1}.r2{grid-row:span 2}
@media(max-width:900px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.s2{grid-column:span 1}.s3,.s4,.s6{grid-column:1/-1}.r2{grid-row:auto}}
@media(max-width:560px){.bento{grid-template-columns:minmax(0,1fr)}.s2{grid-column:1/-1}}
.kicker{font:700 12px Inter,sans-serif;letter-spacing:.4px;color:var(--coral);text-transform:uppercase}
h1{font-size:clamp(24px,4.6vw,36px);line-height:1.08;margin:6px 0 8px;text-wrap:balance}
h2{font-size:18px;margin:0 0 10px}
.mute{color:var(--mute)}.small{font-size:14px}
.facts{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0 16px;font-size:13px;color:var(--mute)}
.facts b{display:block;font:700 20px Poppins,sans-serif;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:14px;border:0;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.btn.pri{background:linear-gradient(135deg,#0B4F4A,#0e7b72);color:#fff;box-shadow:0 8px 20px rgba(11,79,74,.25)}
.btn.sec{background:var(--glass2);color:var(--teal);border:1px solid var(--line)}
.btn.wa{background:#1fa855;color:#fff;box-shadow:0 8px 20px rgba(31,168,85,.25)}
.btn.coral{background:var(--coral);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus,select:focus,nav a:focus-visible,.stile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{font:16px Inter,sans-serif;color:var(--ink);background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.err{color:var(--bad);font-size:14px;min-height:1.2em;margin:8px 0 0}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font:600 12.5px Inter,sans-serif;white-space:nowrap}
.s-Checked{background:var(--okbg);color:var(--ok)}.s-Submitted{background:var(--subbg);color:var(--sub)}
.s-Redo{background:var(--redobg);color:var(--redo)}.s-Notdone{background:var(--badbg);color:var(--bad)}.s-Pending{background:var(--pendbg);color:var(--pend)}
.s-Ready{background:rgba(255,107,84,.16);color:#b8402c}.s-Uptodate{background:var(--pendbg);color:var(--pend)}
.big{font:700 26px Poppins,sans-serif;margin:6px 0}
.stars{color:var(--gold);font-size:19px;letter-spacing:2px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--teal2) calc(var(--p)*1%),rgba(11,79,74,.12) 0)}
.ring span{width:74px;height:74px;border-radius:50%;background:var(--glass2);display:grid;place-items:center;font:700 20px Poppins,sans-serif}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list li:first-child{border-top:0}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.sum .glass{padding:12px 16px;border-radius:18px;cursor:pointer}
.sum .on{outline:2px solid var(--teal)}
.sum b{display:block;font:700 26px Poppins,sans-serif}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.stile{padding:16px;cursor:pointer;text-align:left;color:inherit;font:inherit;display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .15s}
.stile:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(11,79,74,.16)}
.stile .nm{font:700 17px Poppins,sans-serif}
.stile .bar{height:6px;border-radius:9px;background:rgba(11,79,74,.12);overflow:hidden}
.stile .bar i{display:block;height:100%;background:linear-gradient(90deg,#0e7b72,#E0A93B)}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 16px Poppins,sans-serif;color:#fff;flex:none}
.q5 li{align-items:flex-start}
.q5 .n{font:700 13px Poppins,sans-serif;color:var(--mute);width:22px;flex:none}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.acts button.mark{min-height:38px;padding:6px 11px;border-radius:11px;border:1px solid var(--line);background:var(--glass2);font:600 13px Inter,sans-serif;cursor:pointer;color:var(--ink)}
.acts button.mark.on{border-color:var(--teal);background:var(--teal);color:#fff}
.starbtn{border:0;background:none;font-size:22px;color:#cbbd96;padding:2px;cursor:pointer}
.starbtn.lit{color:var(--gold)}
.warn{background:rgba(224,169,59,.18);border:1px solid rgba(224,169,59,.5);border-radius:12px;padding:8px 12px;font-size:13.5px;margin:8px 0}
.scroll{overflow-x:auto}
table.reg{border-collapse:collapse;width:100%;font-size:14px}
table.reg th,table.reg td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center;white-space:nowrap}
table.reg th:first-child,table.reg td:first-child{text-align:left;position:sticky;left:0;background:rgba(255,255,255,.9)}
.c-ok{color:var(--ok);font-weight:700}.c-sub{color:var(--sub);font-weight:700}.c-redo{color:var(--redo);font-weight:700}.c-bad{color:var(--bad);font-weight:700}.c-none{color:#9fb0ae}
.pwbox{background:rgba(255,247,230,.9);border:1px solid var(--gold);border-radius:16px;padding:14px;margin-bottom:14px}
.pwbox code{font:700 20px ui-monospace,monospace}
.demo{background:var(--gold);color:#2a1d00;text-align:center;font:600 13px Inter,sans-serif;padding:6px}
.hide{display:none!important}
.loginwrap{max-width:430px;margin:7vh auto 0;padding:26px}
footer{text-align:center;font-size:13px;color:var(--mute);padding:0 16px 28px}
.hero{padding:20px 22px;margin-bottom:14px;background:linear-gradient(135deg,rgba(11,79,74,.92),rgba(14,123,114,.86));color:#fff;border-color:rgba(255,255,255,.3)}
.hero h1{color:#fff;margin:4px 0}.hero .mute{color:rgba(255,255,255,.85)}.hero .kicker{color:#ffd9a8}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{position:relative;display:block;padding:14px 16px;border-radius:18px;text-decoration:none;color:var(--ink);overflow:hidden}
.kpi span{font-size:13px;color:var(--mute);font-weight:600}.kpi b{display:block;font:700 28px Poppins,sans-serif;margin-top:2px}
.kpi i{position:absolute;right:12px;top:10px;font-style:normal;font-size:22px;opacity:.55}
a.kpi:hover{transform:translateY(-2px);transition:transform .15s}
.th{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}.th h2{margin:0}
.tasks li{align-items:center}.who2{display:flex;gap:10px;align-items:flex-start;flex:1 1 220px}
.empty{color:var(--mute);justify-content:center!important;padding:18px 0!important}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:18px;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.cbtn{border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--teal);border-radius:999px;padding:7px 13px;font:600 13.5px Inter,sans-serif;cursor:pointer;min-height:36px}
.cbtn.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.bar.big{height:10px;border-radius:9px;background:rgba(11,79,74,.12);overflow:hidden}.bar.big i{display:block;height:100%;background:linear-gradient(90deg,#0e7b72,#E0A93B)}
.kpi .bar{height:6px;border-radius:9px;background:rgba(11,79,74,.12);overflow:hidden}.kpi .bar i{display:block;height:100%;position:static;opacity:1;background:linear-gradient(90deg,#0e7b72,#E0A93B)}
.payform{flex-basis:100%;padding:10px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid var(--line)}
.lnk{border:0;background:none;color:var(--bad);font:600 12px Inter,sans-serif;cursor:pointer;padding:0 2px;text-decoration:underline}
body.staff nav a{display:inline-flex;align-items:center;gap:6px}body.staff nav a i{font-style:normal}
@media(max-width:760px){
  body.staff{padding-bottom:78px}
  body.staff nav{position:fixed;left:0;right:0;bottom:0;z-index:8;margin:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:0;flex-wrap:nowrap;overflow-x:auto;
    background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);width:auto}
  body.staff nav a{flex:1 0 auto;flex-direction:column;gap:0;padding:6px 10px;border:0;background:none;border-radius:12px;font-size:11.5px;min-width:64px}
  body.staff .toast{bottom:92px}
  body.staff nav a i{font-size:20px}body.staff nav a.on{background:rgba(11,79,74,.1);color:var(--teal)}
}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9;padding:12px 16px;max-width:90vw}
@media(prefers-reduced-motion:no-preference){.tile,.stile{animation:rise .35s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<div id="demo" class="demo hide">Demo mode – sample data only, nothing is saved.</div>
<header class="glass">
  <div class="brand">HINDE CLASSES<small>Home Task Portal · Bicholim, Goa</small></div>
  <span class="who" id="who"></span>
  <button id="out" class="pill hide" type="button">Log out</button>
  <nav id="nav" class="hide"></nav>
</header>
<main id="app"><p class="mute">Loading…</p></main>
<footer>Hinde Classes · Bicholim, Goa · Maitreya Hinde | 7358425108</footer>

<script>
{
/* ---------- settings ---------- */
const API_URL = "https://script.google.com/macros/s/AKfycbyCaaL-WbSf9FCZ51KE7ZqBInC0eIbXdNF1_UVLfZsAWUjBORTxI9u5FHjNn34thIjz/exec";
const WA_TEACHER = "917358425108";
const GROUP_ORDER = ["6GB","7GB","7ICSE","8GB","9GB","9CBSE","10GB","10ADV","CRASH10"];
const GROUP_NAME = {"6GB":"Std 6 · Goa Board","7GB":"Std 7 · Goa Board","7ICSE":"Std 7 · ICSE","8GB":"Std 8 · Goa Board",
  "9GB":"Std 9 · Goa Board","9CBSE":"Std 9 · CBSE","10GB":"Std 10 · Goa Board","10ADV":"Std 10 · Goa Board (advanced)","CRASH10":"Std 10 · Crash Course (30 days)"};
const GROUP_SHORT = {"6GB":"6 GB","7GB":"7 GB","7ICSE":"7 ICSE","8GB":"8 GB","9GB":"9 GB","9CBSE":"9 CBSE","10GB":"10 GB","10ADV":"10 GB+","CRASH10":"10 Crash"};
const AV_COL = ["#0B4F4A","#c2452f","#9a6b12","#2463a6","#6b3fa0","#1b8a4b","#8c2f5d","#0e7b72"];
const DONE = ["Submitted","Checked"];
const DEMO = new URLSearchParams(location.search).has("demo");

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
const istISO = (d = new Date()) => new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
const nice = iso => !/^\d{4}-\d{2}-\d{2}$/.test(iso||"") ? "" : new Date(iso+"T12:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});
const addDays = (iso, n) => { const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return istISO(d); };
const time = t => t ? new Date(t).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit",timeZone:"Asia/Kolkata"}) : "";
const ago = t => { if (!t) return ""; const h = (Date.now() - new Date(t)) / 36e5; return h < 1 ? "just now" : h < 24 ? Math.round(h) + " h ago" : Math.round(h/24) + " d ago"; };
const phone91 = p => { p = String(p||"").replace(/\D/g,""); return p.length === 10 ? "91"+p : p; };
const chip = s => `<span class="chip s-${esc(String(s).replace(/\s/g,""))}">${esc(s === "Checked" ? "Checked ✓" : s === "Ready" ? "Ready for next" : s)}</span>`;
const starsTxt = n => n ? "★".repeat(n) + "☆".repeat(5-n) : "";
const slug = u => "s-" + String(u).replace(/[^a-z0-9]/gi, "-");
const initials = n => String(n).split(/\s+/).map(x => x[0]).join("").slice(0,2).toUpperCase();
const avCol = n => AV_COL[[...String(n)].reduce((a,c) => a + c.charCodeAt(0), 0) % AV_COL.length];
function toast(m, bad) { const d = document.createElement("div"); d.className = "glass toast"; d.style.borderColor = bad ? "var(--bad)" : "var(--teal)"; d.textContent = m; document.body.append(d); setTimeout(() => d.remove(), 3200); }

const SKEY = DEMO ? "hc_hw_session_demo" : "hc_hw_session";
let session = store.get(SKEY);
let manifest = {version:2, groups:{}};

/* ---------- API ---------- */
async function api(action, data = {}) {
  const body = Object.assign({action, token: session && session.token}, data);
  let res;
  if (DEMO) res = await mock(body);
  else {
    const r = await fetch(API_URL, {method:"POST", body: JSON.stringify(body)});
    res = await r.json();
  }
  if (!res.ok) {
    if (res.error === "SESSION_EXPIRED") { logout(true); throw new Error("Please log in again."); }
    throw new Error(res.error || "Something went wrong.");
  }
  return res;
}

/* ---------- worksheets ---------- */
// Worksheets are topic-wise: manifest.groups[GROUP] = [{id, seq, subject, chapter, ws, file, questions, ...}].
// The backend's "date" field holds the worksheet id (old dated sheets keep their date as id).
function sheetFor(user, id) {
  const e = (manifest.groups[user.group] || []).find(w => w.id === id);
  if (!e) return null;
  const v = user.variant && e.variants && e.variants[user.variant];
  return Object.assign({date: id}, e, v || {});
}
const wsTitle = w => `${w.chapter}${w.ws ? " · Worksheet " + w.ws : ""}`;
const bySent = (a, b) => (a.sentAt || a.date || "").localeCompare(b.sentAt || b.date || "");
const wsLink = (ws, name) => `${ws.file}.html?n=${encodeURIComponent(name||"")}`;
const groupDates = g => (manifest.groups[g] || []).slice().sort((a,b) => a.seq - b.seq).map(w => w.id);
function taskMsg(s, ws) {
  return `Dear Parent,\nGreetings from Hinde Classes! 🙏\n\n📘 *New Home Task for ${s.name}*\n${ws.subject}: ${wsTitle(ws)}\n⏱ About 2 hours · ${ws.questions} questions\n\n📲 *Open it on the portal:* hindeclasses.com/homework\n   Username: *${s.username}* (password as given)\n\n✅ When finished, press *Submitted in class* or *Send photos on WhatsApp* in the portal (photos to 7358425108). The next worksheet is sent after this one is done.\n\nThank you for your support!\n– Maitreya Hinde\nHinde Classes, Bicholim | 7358425108`;
}
const waTo = (phone, text) => `https://wa.me/${phone91(phone)}?text=${encodeURIComponent(text)}`;

/* ---------- shell ---------- */
function setShell() {
  const u = session && session.user;
  $("#who").textContent = u ? `${u.name}${u.role !== "student" ? " · " + u.role : ""}` : "";
  $("#out").classList.toggle("hide", !u);
  const nav = $("#nav");
  if (!u) { nav.classList.add("hide"); return; }
  const items = u.role === "student"
    ? [["home","My worksheet"],["history","All worksheets"],["account","Password"]]
    : [["home","🏠 Today"],["students","👥 Students"],["worksheets","📚 Worksheets"]].concat(u.role === "admin" ? [["fees","💰 Fees"]] : [])
        .concat([["register","📊 Register"],["crash","🚀 Crash course"],["accounts","⚙️ Accounts"],["account","🔑 Password"]]);
  document.body.classList.toggle("staff", u.role !== "student");
  nav.innerHTML = items.map(([h,t]) => { if (h === "crash") { const [ic, ...w] = t.split(" "); return `<a href="/crash10/"><i>${ic}</i><span>${w.join(" ")}</span></a>`; } const [ic, ...w] = t.split(" "); return u.role === "student" ? `<a href="#${h}" data-h="${h}">${t}</a>` : `<a href="#${h}" data-h="${h}"><i>${ic}</i><span>${w.join(" ")}</span></a>`; }).join("");
  nav.classList.remove("hide");
  placeNav();
}
// On phones the staff menu is a bottom tab bar. It must live outside the frosted header,
// because a backdrop-filter parent would trap a position:fixed child.
const MQ = matchMedia("(max-width:760px)");
function placeNav() {
  const nav = $("#nav"), staff = document.body.classList.contains("staff");
  if (staff && MQ.matches) { if (nav.parentNode !== document.body) document.body.append(nav); }
  else if (nav.parentNode !== $("header")) $("header").append(nav);
}
MQ.addEventListener("change", placeNav);
function markNav(h) { document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.h === h || (h.startsWith("s-") && a.dataset.h === "students") || (h.startsWith("todo-") && a.dataset.h === "home"))); }
function logout(silent) {
  if (!silent && session) api("logout").catch(() => {});
  session = null; store.del(SKEY); setShell(); route();
}
$("#out").addEventListener("click", () => logout());
function showErr(e) { if (!session) return; $("#app").innerHTML = `<div class="glass tile"><p class="err" style="margin:0">${esc(e.message)}</p></div>`; }

/* ---------- login ---------- */
function viewLogin(msg) {
  $("#app").innerHTML = `<div class="loginwrap glass">
    <div class="kicker">Hinde Classes</div><h1>Log in</h1><p class="mute small">Students and parents: use the username and password given by Hinde Classes.</p>

async function loadOverview() {
  const r = await api("adminOverview");
  OV = r; OV.byUser = {}; OV.requests = r.requests || [];
  r.students = r.students.filter(s => s.group !== "CRASH10");   // crash-course students live in /crash10/
  r.students.forEach(s => {
    const asg = r.assignments.filter(a => a.username === s.username).sort(bySent);
    const items = asg.map(a => Object.assign({status:"Pending"}, r.status.find(x => x.username === s.username && x.date === a.date) || {}, a));
    const cur = items[items.length-1];
    const sent = new Set(asg.map(a => a.date));
    const next = groupDates(s.group).filter(d => !sent.has(d)).slice(0, 5);
    const done = items.filter(i => DONE.includes(i.status)).length;
    let state;
    if (cur && cur.status === "Submitted") state = "To check";
    else if (!cur || DONE.includes(cur.status) || cur.status === "Not done") state = next.length ? "Ready" : "Up to date";
    else state = cur.status === "Redo" ? "Redo" : "Working";
    const days = cur && cur.sentAt ? (Date.now() - new Date(cur.sentAt)) / 864e5 : 0;
    OV.byUser[s.username] = {s, items, cur, next, done, pct: items.length ? Math.round(done/items.length*100) : 0, state, late: (state === "Working" || state === "Redo") && days > 2};
  });
}
async function loadFees(force) {
  if (!isAdmin()) return null;
  if (!FEES || force) { try { FEES = await api("adminFees"); } catch (e) { FEES = {error: e.message}; } }
  return FEES.error ? null : FEES;
}
function feeState(st, month) {
  const paid = FEES.payments.filter(p => p.username === st.username && p.month === month).reduce((a, p) => a + p.amount, 0);
  if (st.feePlan === "paid") return {paid, due: 0, label: "Paid for year", cls: "Checked"};
  if (st.feePlan === "course") {   // one-time course fee (crash course): count payments in every month
    const all = FEES.payments.filter(p => p.username === st.username).reduce((a, p) => a + p.amount, 0);
    return all >= st.fee ? {paid, due: 0, label: "Course paid", cls: "Checked"} : {paid, due: month === monthISO() ? st.fee - all : 0, label: all ? "Course part paid" : "Course fee due", cls: all ? "Redo" : "Notdone"};
  }
  if (!st.fee) return {paid, due: 0, label: "No fee set", cls: "Pending"};
  if (paid >= st.fee) return {paid, due: 0, label: "Paid", cls: "Checked"};
  return {paid, due: st.fee - paid, label: paid ? "Part paid" : "Due", cls: paid ? "Redo" : "Notdone"};
}

async function adminFees() {
  if (!isAdmin()) { location.hash = "#students"; return; }
  $("#app").innerHTML = `<p class="mute">Loading fees…</p>`;
  const f = await loadFees(true);
  if (!f) return showErr(new Error(FEES && FEES.error === "Unknown action" ? "Fees need the new Code.gs: paste it into Apps Script, run setup once, then Deploy → Manage deployments → ✏️ → New version." : (FEES && FEES.error) || "Could not load fees."));
  let month = store.get("hc_hw_month") || monthISO();
  const months = []; { const d = new Date(); d.setDate(15); for (let i = -2; i < 10; i++) { const m = new Date(d.getFullYear(), d.getMonth() - i, 15); months.push(istISO(m).slice(0, 7)); } }
  if (!months.includes(month)) month = monthISO();
  const draw = () => {
    const list = f.students.slice().sort((a,b) => (GROUP_ORDER.indexOf(a.group) - GROUP_ORDER.indexOf(b.group)) || a.name.localeCompare(b.name));
    const rows = list.map(st => Object.assign({st}, feeState(st, month)));
    const expected = rows.reduce((a, r) => a + (r.st.feePlan === "paid" ? 0 : r.st.feePlan === "course" ? r.paid + r.due : r.st.fee), 0);
    const got = rows.reduce((a, r) => a + r.paid, 0), due = rows.reduce((a, r) => a + r.due, 0);
    const pct = expected ? Math.min(100, Math.round(got / expected * 100)) : 0;
    $("#fsum").innerHTML = `<div class="kpi glass"><span>Expected</span><b>${rupees(expected)}</b><i>📒</i></div>
      <div class="kpi glass"><span>Collected</span><b style="color:var(--ok)">${rupees(got)}</b><i>✅</i></div>
      <div class="kpi glass"><span>Still due</span><b style="color:var(--bad)">${rupees(due)}</b><i>⏳</i></div>
      <div class="kpi glass"><span>Collected</span><b>${pct}%</b><div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div></div>`;
    $("#fl").innerHTML = rows.map(r => { const st = r.st; const pays = f.payments.filter(p => p.username === st.username && p.month === month);
      const lbl = r.label; const cls = r.cls;
      return `<li data-row="${esc(st.username)}"><span class="who2">${avatar(st.name)}<span><b>${esc(st.name)}</b> <span class="small mute">${esc(GROUP_SHORT[st.group]||"")}</span><br>
        <span class="small mute">${st.feePlan === "paid" ? "Paid in full for the year" : st.feePlan === "course" ? "Course fee " + rupees(st.fee) + " (one time)" : st.fee ? rupees(st.fee) + " / month" : "No fee set"}${pays.map(p => ` · paid ${rupees(p.amount)} ${esc(p.mode||"")} ${esc(time(p.paidOn))} <button class="lnk" data-undo="${esc(p.row)}" data-un="${esc(st.username)}" title="Delete this payment">undo</button>`).join("")}</span></span></span>
        <span class="row"><span class="chip s-${cls}">${esc(lbl)}${r.due && r.paid ? " · " + rupees(r.due) + " left" : ""}</span>
        ${r.due ? `<button class="btn pri sm" data-pay="${esc(st.username)}">Mark paid</button>${st.parentPhone ? `<a class="btn sec sm" target="_blank" rel="noopener" href="${esc(waTo(st.parentPhone, `Dear Parent, a gentle reminder from Hinde Classes: ${st.name}'s fee for ${monthName(month)} (${rupees(r.due)}) is due. You can pay by cash or UPI. Thank you! – Maitreya Hinde, 7358425108`))}">Remind</a>` : ""}` : ""}
        <button class="btn sec sm" data-plan="${esc(st.username)}" title="Change monthly fee">✎</button></span>
        <div class="payform hide" id="pf-${esc(slug(st.username))}"></div></li>`; }).join("");
    document.querySelectorAll("[data-pay]").forEach(b => b.onclick = () => payForm(b.dataset.pay, rows.find(r => r.st.username === b.dataset.pay)));
    document.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => planForm(b.dataset.plan));
    document.querySelectorAll("[data-undo]").forEach(b => b.onclick = async () => {
      if (!confirmInline(b)) return;

    });
  };
  const confirmInline = b => { if (b.dataset.sure) return true; b.dataset.sure = 1; b.textContent = "tap again to delete"; setTimeout(() => { delete b.dataset.sure; b.textContent = "undo"; }, 3000); return false; };
  const box = u => $("#pf-" + slug(u));
  const payForm = (u, r) => {
    const el = box(u); el.classList.remove("hide");
    el.innerHTML = `<form class="row"><input type="number" min="1" step="1" value="${r.due || r.st.fee}" aria-label="Amount" style="width:130px">
      <select aria-label="Paid by" style="width:auto"><option>UPI</option><option>Cash</option><option>Bank</option><option>Cheque</option></select>
      <input placeholder="Note (optional)" style="flex:1 1 140px;width:auto"><button class="btn pri sm">Save ${esc(monthName(month).split(" ")[0])}</button><button type="button" class="btn sec sm">Cancel</button></form>`;
    const [amt, mode, note] = el.querySelectorAll("input,select");
    el.querySelector("button[type=button]").onclick = () => el.classList.add("hide");

      catch (err) { toast(err.message, true); } };

    const [plan, fee] = el.querySelectorAll("select,input");
    el.querySelector("button[type=button]").onclick = () => el.classList.add("hide");

      try { await api("adminFeePlan", {username: u, fee: Number(fee.value), feePlan: plan.value}); toast("Saved ✓"); await loadFees(true); Object.assign(f, FEES); draw(); }
      catch (err) { toast(err.message, true); } };
  };
  $("#app").innerHTML = `<div class="toolbar glass"><h2 style="margin:0">💰 Fees</h2>
      <select id="fm" style="width:auto">${months.map(m => `<option value="${m}" ${m===month?"selected":""}>${esc(monthName(m))}</option>`).join("")}</select>
      <button class="btn sec sm" id="fcsv">Copy as CSV</button></div>
    <div class="kpis" id="fsum"></div>
    <div class="glass tile"><ul class="list tasks" id="fl"></ul>
    <p class="small mute" style="margin-bottom:0">Fees are private: only admin logins can see this page.</p></div>`;
  $("#fm").onchange = e => { month = e.target.value; store.set("hc_hw_month", month); draw(); };
  $("#fcsv").onclick = async () => {
    const lines = [["Student","Class","Plan","Monthly fee","Paid " + month,"Due"]].concat(f.students.map(st => { const r = feeState(st, month); return [st.name, GROUP_NAME[st.group]||st.group, st.feePlan, st.fee, r.paid, r.due]; }));
    try { await navigator.clipboard.writeText(lines.map(l => l.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n")); $("#fcsv").textContent = "Copied ✓"; } catch (e) {}
  };
  draw();

async function adminRegister() {
  const span = Number(store.get("hc_hw_span") || 14);
  $("#app").innerHTML = `<div class="glass tile"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">📊 Progress register</h2>
    <div class="row"><select id="span" style="width:auto">${[7,14,30,60].map(n => `<option value="${n}" ${n===span?"selected":""}>Sent in last ${n} days</option>`).join("")}</select>
    <button class="btn sec sm" id="csv">Copy as CSV</button></div></div><div id="wk" class="scroll"><p class="mute">Loading…</p></div>
    <p class="small mute" style="margin-bottom:0">One column per worksheet sent, oldest first. ✓ checked · S submitted · ↺ redo · ✗ not done · · pending.</p></div>`;
  $("#span").onchange = e => { store.set("hc_hw_span", Number(e.target.value)); adminRegister(); };
  try { await loadOverview(); } catch (e) { return showErr(e); }
  const from = addDays(istISO(), -(span-1));
  const all = sortStudents(Object.values(OV.byUser));
  const rowsFor = x => x.items.filter(i => (i.sentAt ? istISO(new Date(i.sentAt)) : i.date) >= from);
  const cols = Math.max(0, ...all.map(x => rowsFor(x).length));
  const sym = {Checked:["✓","c-ok"],Submitted:["S","c-sub"],Redo:["↺","c-redo"],"Not done":["✗","c-bad"],Pending:["·","c-none"]};
  const csv = [["Student","Class",...Array.from({length: cols}, (_, i) => "WS " + (i+1)),"Sent","Done","Completion %"]];
  let t = `<table class="reg"><thead><tr><th>Student</th>${Array.from({length: cols}, (_, i) => `<th>${i+1}</th>`).join("")}<th>Done</th><th>%</th></tr></thead><tbody>`;
  all.forEach(x => {
    const its = rowsFor(x); const done = its.filter(i => DONE.includes(i.status)).length; const pct = its.length ? Math.round(done/its.length*100) : 0;
    t += `<tr><td><a href="#${slug(x.s.username)}"><b>${esc(x.s.name)}</b></a><div class="small mute">${esc(GROUP_SHORT[x.s.group]||x.s.group)}</div></td>`;
    const line = [x.s.name, GROUP_NAME[x.s.group]||x.s.group];
    for (let i = 0; i < cols; i++) { const it = its[i]; if (!it) { t += `<td class="c-none">–</td>`; line.push(""); continue; }
      const w = sheetFor(x.s, it.date); const [sy, c] = sym[it.status] || ["?",""];
      t += `<td class="${c}" title="${esc((w ? wsTitle(w) : it.date) + " – " + it.status)}">${sy}</td>`; line.push(it.status); }
    t += `<td>${done}/${its.length}</td><td><b>${its.length ? pct + "%" : "–"}</b></td></tr>`; line.push(its.length, done, its.length ? pct : ""); csv.push(line);
  });
  $("#wk").innerHTML = t + `</tbody></table>`;
  $("#csv").onclick = async () => {
    const text = csv.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
    try { await navigator.clipboard.writeText(text); $("#csv").textContent = "Copied ✓"; } catch (e) { $("#csv").textContent = "Copy failed"; }
    setTimeout(() => $("#csv").textContent = "Copy as CSV", 2000);
  };
}

    ${admin ? `<button class="btn pri sm" id="add">+ Add student or teacher</button>` : ""}</div><ul class="list" id="ul" style="margin-top:8px"><li class="mute">Loading…</li></ul></div>`;
  let r; try { r = await api("adminUsers"); } catch (e) { return showErr(e); }
  const users = r.users.sort((a,b) => (a.role==="student") - (b.role==="student") || (GROUP_ORDER.indexOf(a.group) - GROUP_ORDER.indexOf(b.group)) || a.name.localeCompare(b.name));
  $("#ul").innerHTML = users.map(u => `<li><span><b>${esc(u.name)}</b> <span class="small mute">${esc(u.username)}</span><br>
    <span class="small mute">${u.role === "student" ? esc(GROUP_NAME[u.group]||u.group) + (u.variant ? " · extra practice" : "") : esc(u.role) + (u.teacherGroups ? " · classes: " + esc(u.teacherGroups) : "")}
    ${u.parentPhone ? " · 📞 " + esc(u.parentPhone) : ""}${u.active === false ? " · <b style='color:var(--bad)'>inactive</b>" : ""}</span></span>
    ${admin ? `<span class="row"><button class="btn sec sm" data-edit="${esc(u.username)}">Edit</button><button class="btn sec sm" data-reset="${esc(u.username)}">Reset password</button></span>` : ""}</li>`).join("");
  if (!admin) return;
  $("#add").onclick = () => userForm({role:"student", active:true}, true);
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => userForm(users.find(u => u.username === b.dataset.edit), false));
  document.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => {
    const u = users.find(x => x.username === b.dataset.reset);
    $("#form").innerHTML = `<div class="pwbox"><p>Make a new password for <b>${esc(u.name)}</b>? The old one will stop working.</p><div class="row"><button class="btn coral sm" id="cy">Yes</button><button class="btn sec sm" id="cn">Cancel</button></div></div>`;
    $("#cn").onclick = () => $("#form").innerHTML = "";
    $("#cy").onclick = async () => { try { const x = await api("adminResetPassword", {username: u.username}); pwShow(u, x.password); } catch (e) { toast(e.message, true); } };
    scrollTo({top: 0, behavior: "smooth"});
  });
}
function userForm(u, isNew) {
  const groups = GROUP_ORDER.map(g => `<option value="${g}" ${u.group===g?"selected":""}>${esc(GROUP_NAME[g])}</option>`).join("");
  $("#form").innerHTML = `<div class="glass tile" style="margin-bottom:14px"><h2>${isNew ? "New account" : "Edit " + esc(u.name)}</h2><form id="uf" class="bento" style="gap:10px">
    <div class="s3"><label>Full name</label><input name="name" value="${esc(u.name||"")}" required></div>
    <div class="s3"><label>Username</label><input name="username" value="${esc(u.username||"")}" ${isNew ? "" : "readonly"} required placeholder="firstname.hc" autocapitalize="none"></div>
    <div class="s2"><label>Role</label><select name="role">${["student","teacher","admin"].map(r => `<option ${u.role===r?"selected":""}>${r}</option>`).join("")}</select></div>
    <div class="s2"><label>Class (students)</label><select name="group"><option value="">–</option>${groups}</select></div>
    <div class="s2"><label>Extra Maths practice</label><select name="variant"><option value="">No</option><option value="x" ${u.variant==="x"?"selected":""}>Yes</option></select></div>
    <div class="s2"><label>Parent WhatsApp number</label><input name="parentPhone" inputmode="numeric" value="${esc(u.parentPhone||"")}" placeholder="10-digit number"></div>
    <div class="s2"><label>Teacher's classes (7GB,8GB or *)</label><input name="teacherGroups" value="${esc(u.teacherGroups||"")}"></div>
    <div class="s2"><label>Login allowed</label><select name="active"><option value="1">Active</option><option value="0" ${u.active===false?"selected":""}>Turned off</option></select></div>
    <div class="s6 row"><button class="btn pri">Save</button><button type="button" class="btn sec" id="cancel">Cancel</button><span class="err" id="fe"></span></div></form></div>`;
  $("#cancel").onclick = () => $("#form").innerHTML = "";
  scrollTo({top: 0, behavior: "smooth"});
  $("#uf").onsubmit = async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); f.active = f.active === "1";
    try { const x = await api("adminSaveUser", {user: f}); OV = null; if (x.password) pwShow(f, x.password, true); else { toast("Saved ✓"); adminAccounts(); } }
    catch (err) { $("#fe").textContent = err.message; }
  };
}
function pwShow(u, pw, isNew) {
  const msg = `Hinde Classes Home Task Portal\nWebsite: hindeclasses.com/homework\nUsername: ${u.username}\nPassword: ${pw}\nPlease keep this private.`;
  $("#form").innerHTML = `<div class="pwbox"><b>${isNew ? "Account created" : "New password"} for ${esc(u.name)}</b>
    <p>Username: <code>${esc(u.username)}</code><br>Password: <code>${esc(pw)}</code></p>
    <p class="small mute">This password is shown only now. Send it to the student or parent.</p>
    <div class="row"><a class="btn wa sm" target="_blank" rel="noopener" href="${esc(waTo(u.parentPhone, msg))}">Send on WhatsApp</a>
    <button class="btn sec sm" id="cp">Copy</button><button class="btn sec sm" id="done">Done</button></div></div>`;
  $("#cp").onclick = async () => { try { await navigator.clipboard.writeText(msg); $("#cp").textContent = "Copied ✓"; } catch (e) {} };
  $("#done").onclick = () => adminAccounts();
}

/* --- password (everyone) --- */
function account() {
  $("#app").innerHTML = `<div class="glass tile" style="max-width:480px"><h2>Change password</h2><form id="pf">
    <div style="margin:10px 0"><label>Current password</label><input type="password" id="p0" autocomplete="current-password" required></div>
    <div style="margin:10px 0"><label>New password (6+ characters)</label><input type="password" id="p1" autocomplete="new-password" minlength="6" required></div>
    <button class="btn pri">Change password</button><p class="err" id="pe"></p></form></div>`;
  $("#pf").onsubmit = async e => {
    e.preventDefault();
    try { await api("changePassword", {oldPassword: $("#p0").value, newPassword: $("#p1").value}); $("#pe").style.color = "var(--ok)"; $("#pe").textContent = "Password changed."; e.target.reset(); }
    catch (err) { $("#pe").style.color = ""; $("#pe").textContent = err.message; }
  };
}

/* ---------- router ---------- */
function route() {
  if (!session) { setShell(); return viewLogin(""); }
  const h = (location.hash || "#home").slice(1) || "home";
  markNav(h);
  if (session.user.role === "student") return ({home: studentHome, history: studentHistory, account}[h] || studentHome)();
  if (h.startsWith("s-")) return adminStudent(h);
  if (h.startsWith("todo-")) { const el = document.getElementById(h); if (el) { el.scrollIntoView({behavior: "smooth"}); return; } }
  if (h === "home" || h === "students") OV = null;
  ({home: adminToday, students: adminStudents, worksheets: adminWorksheets, fees: adminFees, register: adminRegister, accounts: adminAccounts, account}[h] || adminToday)();
}
window.addEventListener("hashchange", route);

/* ---------- demo backend (only with ?demo) ---------- */
let mockDB = (() => { try { return JSON.parse(sessionStorage.getItem("hc_hw_mock")); } catch (e) { return null; } })();
async function mock(b) { const r = mock2(b); try { sessionStorage.setItem("hc_hw_mock", JSON.stringify(mockDB)); } catch (e) {} return r; }
function mock2(b) {
  if (!mockDB) {
    const S = [["demo.student","Demo Student","7GB","x"],["aman.demo","Aman","7GB",""],["riya.demo","Riya","8GB",""],["kabir.demo","Kabir","9GB",""],["tara.demo","Tara","10ADV",""],["neel.demo","Neel","6GB",""]];
    mockDB = {users: [{username:"demo.admin",name:"Demo Teacher",role:"admin",group:"",variant:"",pw:"admin123",active:true,teacherGroups:"*",parentPhone:""}]
      .concat(S.map(([u,n,g,v]) => ({username:u,name:n,role:"student",group:g,variant:v,pw:"demo123",active:true,parentPhone:"9800000000"}))),
      status: [], assign: [], sessions: {}, pays: [], reqs: []};
    const FEE = {"demo.student":[2500,"monthly"],"aman.demo":[2700,"monthly"],"riya.demo":[2000,"monthly"],"kabir.demo":[0,"paid"],"tara.demo":[500,"monthly"],"neel.demo":[1500,"monthly"]};
    mockDB.users.forEach(u => { const f = FEE[u.username]; if (f) { u.fee = f[0]; u.feePlan = f[1]; } });
    mockDB.pays.push({month: monthISO(), username: "aman.demo", amount: 2700, paidOn: new Date().toISOString(), mode: "UPI", note: "", row: 2});
    const first = groupDates("7GB")[0];
    if (first) {
      const t = new Date(Date.now() - 20 * 36e5).toISOString();
      ["demo.student","aman.demo","riya.demo","kabir.demo","tara.demo"].forEach(u => mockDB.assign.push({date: first, username: u, sentAt: t, sentBy: "demo.admin"}));
      mockDB.status.push({date: first, username: "riya.demo", status: "Submitted", method: "In class", submittedAt: new Date().toISOString(), remark: "", stars: ""},
        {date: first, username: "kabir.demo", status: "Checked", method: "Photos on WhatsApp", submittedAt: new Date().toISOString(), remark: "Neat work, show units.", stars: 4});
    }
  }
  const D = mockDB, me = D.sessions[b.token] && D.users.find(u => u.username === D.sessions[b.token]);
  const pub = u => ({username:u.username,name:u.name,role:u.role,group:u.group,variant:u.variant});
  const need = staff => { if (!me) return {ok:false,error:"SESSION_EXPIRED"}; if (staff && me.role === "student") return {ok:false,error:"Teacher login needed."}; };
  const studs = () => D.users.filter(u => u.role === "student");
  switch (b.action) {
    case "login": { const u = D.users.find(x => x.username === String(b.username).trim().toLowerCase() && x.pw === b.password);
      if (!u) return {ok:false,error:"Wrong username or password."}; const t = "t"+Math.random(); D.sessions[t] = u.username; return {ok:true,token:t,user:pub(u)}; }
    case "logout": return {ok:true};
    case "me": return need() || {ok:true,user:pub(me)};
    case "myAssignments": return need() || {ok:true, items: D.assign.filter(a => a.username === me.username).map(a => Object.assign({status:"Pending"}, D.status.find(s => s.username === a.username && s.date === a.date) || {}, a))};
    case "submit": { const e = need(); if (e) return e;
      if (!D.assign.some(a => a.username === me.username && a.date === b.date)) return {ok:false,error:"This worksheet has not been sent to you yet."};
      const cur = D.status.find(r => r.date === b.date && r.username === me.username);
      const rec = {date:b.date,username:me.username,status:"Submitted",method:b.method==="whatsapp"?"Photos on WhatsApp":"In class",submittedAt:new Date().toISOString()};
      if (cur) Object.assign(cur, rec); else D.status.push(rec); return {ok:true}; }
    case "adminOverview": return need(true) || {ok:true, students: studs().map(u => Object.assign(pub(u),{parentPhone:u.parentPhone})), assignments: D.assign, status: D.status, requests: (D.reqs||[]).filter(q => !q.done)};
    case "adminFees": return need(true) || {ok:true, students: studs().map(u => Object.assign(pub(u),{parentPhone:u.parentPhone, fee:u.fee||0, feePlan:u.feePlan||"monthly"})), payments: D.pays||[]};
    case "adminFeePay": { const e = need(true); if (e) return e; D.pays = D.pays||[]; D.pays.push({month:b.month,username:b.username,amount:Number(b.amount),paidOn:new Date().toISOString(),mode:b.mode,note:b.note,row:Date.now()}); return {ok:true}; }
    case "adminFeeUndo": { const e = need(true); if (e) return e; D.pays = D.pays.filter(p => String(p.row) !== String(b.row)); return {ok:true}; }
    case "adminFeePlan": { const e = need(true); if (e) return e; const u = D.users.find(x => x.username === b.username); u.fee = b.fee; u.feePlan = b.feePlan; return {ok:true}; }
    case "adminRequest": { const e = need(true); if (e) return e; D.reqs = D.reqs||[]; D.reqs.push({group:b.group,topic:b.topic,count:b.count,note:b.note,row:Date.now(),created:new Date().toISOString()}); return {ok:true}; }
    case "adminRequestDone": { const e = need(true); if (e) return e; const q = (D.reqs||[]).find(x => String(x.row) === String(b.row)); if (q) q.done = true; return {ok:true}; }
    case "adminAssign": { const e = need(true); if (e) return e; if (!D.assign.some(a => a.username === b.username && a.date === b.date)) D.assign.push({date:b.date,username:b.username,sentAt:new Date().toISOString(),sentBy:me.username}); return {ok:true}; }
    case "adminUnassign": { const e = need(true); if (e) return e; D.assign = D.assign.filter(a => !(a.username === b.username && a.date === b.date)); return {ok:true}; }
    case "adminSet": { const e = need(true); if (e) return e; let cur = D.status.find(r => r.date===b.date && r.username===b.username);
      if (!cur) { cur = {date:b.date,username:b.username}; D.status.push(cur); } Object.assign(cur,{status:b.status,remark:b.remark,stars:b.stars}); return {ok:true}; }
    case "adminUsers": return need(true) || {ok:true, users: D.users.map(u => Object.assign(pub(u),{parentPhone:u.parentPhone,active:u.active,teacherGroups:u.teacherGroups}))};
    case "adminSaveUser": { const e = need(true); if (e) return e; const u = b.user, cur = D.users.find(x => x.username === u.username);
      if (cur) { Object.assign(cur, u); return {ok:true}; } D.users.push(Object.assign({pw:"newpw123"}, u)); return {ok:true,password:"newpw123"}; }
    case "adminResetPassword": return need(true) || {ok:true,password:"reset456"};
    case "changePassword": return need() || (me.pw === b.oldPassword ? (me.pw = b.newPassword, {ok:true}) : {ok:false,error:"Current password is wrong."});
  }
  return {ok:false,error:"Unknown action"};
}

  setShell(); route();

})();
