<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0b12">
<title>Dangerous Dev</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Dangerous Dev: Goa Treasure Hunt. A retro platformer across real Goan places, inspired by the 1990 classic Dangerous Dave.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: an old PC monitor. Top status bar, the pixel game screen, bottom message bar, then (on touch screens) a game-pad. Single dark retro theme by design. */
:root{
  --bezel:#0d0b12; --panel:#15121d; --ink:#f4ecd8; --dim:#8c8499; --gold:#ffd23a; --red:#e8402a; --teal:#3fd0c9; --green:#66d44a;
  --px:"Press Start 2P","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bezel);color:var(--ink);font-family:var(--px);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 6px) max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(8px,env(safe-area-inset-left,0px));gap:6px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10px;line-height:1.4;padding:6px 8px;background:var(--panel);box-shadow:inset 0 0 0 2px #2a2436;width:var(--sw,100%)}
.hud b{color:var(--gold);font-weight:400}
.lives{display:flex;gap:2px;align-items:center}
.lives canvas{width:16px;height:16px;image-rendering:pixelated}
#screen{position:relative;width:var(--sw);height:var(--sh);background:#000;box-shadow:0 0 0 3px #2a2436,0 0 40px rgba(80,60,140,.25);overflow:hidden;flex:none}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.crt.off{display:none}
.msg{flex:1;min-width:0;text-align:center;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.inv{display:flex;align-items:center;gap:6px}
.inv canvas{width:16px;height:16px;image-rendering:pixelated}
.fuel{width:46px;height:8px;background:#000;box-shadow:inset 0 0 0 1px var(--dim)}
.fuel i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transform-origin:left}

/* overlays inside the screen */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center;background:rgba(5,3,10,.72)}
.ov.clear{background:transparent}
.ov.win{background:rgba(5,3,10,.38)}
.logo{font-size:clamp(18px,6.2vw,34px);line-height:1.2;color:var(--gold);text-shadow:3px 3px 0 var(--red);letter-spacing:1px;padding:10px 12px;background:rgba(5,3,10,.55)}
.logo small{display:block;font-size:.42em;color:var(--teal);text-shadow:2px 2px 0 #000;margin-top:10px;letter-spacing:2px}
.press{font-size:11px;color:#fff;animation:blink 1s steps(1) infinite}
.menu{display:flex;flex-direction:column;gap:8px;min-width:min(230px,90%)}
.mbtn{padding:10px 12px;font-size:10px;background:#211b2e;box-shadow:inset 0 0 0 2px #4a3f63,0 3px 0 #000;color:#fff;text-align:center}
.mbtn:hover,.mbtn:focus-visible{background:#2f2742;color:var(--gold)}
.mbtn.primary{background:var(--red);box-shadow:inset 0 0 0 2px #ff8a6a,0 3px 0 #000}
.mbtn:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px #4a3f63}
.credit{font-size:7px;line-height:1.8;color:#cfc6dd;max-width:360px;padding:6px 8px;background:rgba(5,3,10,.7)}
.credit b{color:var(--ink);font-weight:400}
.card{background:#120e1a;box-shadow:inset 0 0 0 2px #4a3f63,0 0 0 2px #000;padding:14px 12px;max-width:min(360px,96%);max-height:100%;overflow:auto}
.card h2{font-size:12px;color:var(--gold);margin:0 0 10px;line-height:1.5;font-weight:400}
.card p{font-size:8.5px;line-height:1.9;margin:6px 0;color:#e8e0d0}
.card .k{color:var(--teal)}
.lvlno{font-size:9px;color:var(--teal);letter-spacing:2px}
.lvlname{font-size:clamp(14px,4.6vw,20px);color:#fff;text-shadow:2px 2px 0 var(--red);line-height:1.4}
.lvlplace{font-size:9px;color:var(--gold)}
.fact{font-size:8px;line-height:1.9;color:#d8d0c0;max-width:340px;padding:8px 10px;background:rgba(255,255,255,.06)}
.q{font-size:clamp(16px,5vw,22px);color:#fff;margin:8px 0}
.opts{display:flex;gap:8px;justify-content:center}
.opts .mbtn{min-width:64px;font-size:13px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.scores{font-size:9px;line-height:2;text-align:left;min-width:200px}
.scores li{display:flex;justify-content:space-between;gap:14px}
.scores ol{margin:0;padding-left:18px}
input.name{font:inherit;font-size:11px;background:#000;color:var(--gold);border:0;box-shadow:inset 0 0 0 2px #4a3f63;padding:8px;width:180px;text-transform:uppercase;text-align:center}
.tiny{font-size:7px;color:var(--dim);line-height:1.8}
.acct{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:7px;line-height:1.8;color:#cfc6dd;padding:6px 8px;background:rgba(5,3,10,.7);max-width:340px}
.acct b{color:var(--gold);font-weight:400}
.acct .lnk{color:var(--dim);text-decoration:underline;font-size:7px}
#gBtn{min-height:0}
.xpbox{font-size:8px;line-height:1.9;color:#e8e0d0;padding:8px 10px;background:rgba(255,210,58,.08);box-shadow:inset 0 0 0 1px rgba(255,210,58,.4);max-width:320px}
.xpbox b{color:var(--gold);font-weight:400}
.xpbox:empty{display:none}
.corner{position:absolute;top:6px;right:6px;display:flex;gap:6px}
.corner button{width:28px;height:28px;font-size:10px;background:rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px #4a3f63}

/* touch game-pad */
#pad{display:flex;justify-content:space-between;align-items:center;width:var(--sw);flex:1;min-height:150px;max-height:230px;padding:4px 6px;touch-action:none}
#pad.landX{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);width:auto;padding:0 max(14px,env(safe-area-inset-left,0px));pointer-events:none;min-height:0}
#pad.landX > *{pointer-events:auto;opacity:.75}
.dpad{position:relative;width:150px;height:150px;border-radius:50%;background:#1d1828;box-shadow:inset 0 0 0 3px #3a3150,0 4px 0 #000;touch-action:none}
.dpad i{position:absolute;background:#3a3150;border-radius:6px}
.dpad i.h{left:20px;right:20px;top:58px;height:34px}
.dpad i.v{top:20px;bottom:20px;left:58px;width:34px}
.dpad span{position:absolute;font-size:12px;color:#bfb6d6;pointer-events:none}
.dpad .on{color:var(--gold)}
.btns{display:grid;grid-template-columns:repeat(2,auto);grid-template-rows:auto auto;gap:10px 12px;align-items:center;touch-action:none}
.pb{width:62px;height:62px;border-radius:50%;font-size:9px;display:grid;place-items:center;background:#3a3150;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),0 4px 0 #000;color:#fff;touch-action:none}
.pb.a{width:78px;height:78px;background:var(--red);grid-row:1 / span 2;grid-column:2;font-size:10px}
.pb.dis{opacity:.35}
.pb.down{transform:translateY(3px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.35),0 1px 0 #000}
.pb.jet.onjet{background:var(--teal);color:#000}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== phone landscape: handheld layout — screen in the middle, grips left and right ===== */
body.lt #app{padding:0;gap:0;display:block;z-index:1}
body.lt #screen{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #2a2436,0 0 30px rgba(80,60,140,.3)}
body.lt::before,body.lt::after{content:"";position:fixed;top:0;bottom:0;width:var(--side);background:linear-gradient(180deg,#1a1524,#100d17);z-index:0}
body.lt::before{left:0;box-shadow:inset -2px 0 0 #2a2436;border-radius:0 26px 26px 0}
body.lt::after{right:0;box-shadow:inset 2px 0 0 #2a2436;border-radius:26px 0 0 26px}
body.lt #hudTop{position:fixed;z-index:2;top:max(8px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));width:calc(var(--side) - 20px);flex-direction:column;align-items:flex-start;gap:5px;background:none;box-shadow:none;padding:4px 0;font-size:9px}
body.lt #hudTop .lives{flex-wrap:wrap}
body.lt #hudBot{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc((100vh - var(--sh))/2 + 3px);width:calc(var(--sw) - 12px);background:rgba(5,3,10,.55);box-shadow:none;padding:4px 6px;font-size:8px;pointer-events:none}
body.lt .corner{position:fixed;top:max(8px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:4}
body.lt .corner button{width:34px;height:34px;font-size:11px;border-radius:8px}
body.lt #pad{position:fixed;inset:0;width:auto;max-height:none;min-height:0;padding:0;display:block;pointer-events:none;z-index:2}
body.lt #pad > *{pointer-events:auto}
body.lt .dpad{position:absolute;left:calc(max(0px,env(safe-area-inset-left,0px)) + var(--side)/2);bottom:max(14px,calc(env(safe-area-inset-bottom,0px) + 8px));transform:translateX(-50%) scale(var(--dps));transform-origin:50% 100%}
body.lt .btns{position:absolute;right:calc(max(0px,env(safe-area-inset-right,0px)) + 8px);bottom:max(14px,calc(env(safe-area-inset-bottom,0px) + 8px));width:calc(var(--side) - 16px);height:calc(var(--bs)*2.5);display:block}
body.lt .pb{position:absolute;width:var(--bs);height:var(--bs);font-size:8px}
body.lt .pb.a{width:calc(var(--bs)*1.25);height:calc(var(--bs)*1.25);right:0;bottom:0;font-size:9px}
body.lt .pb.fire{left:0;bottom:calc(var(--bs)*.1)}
body.lt .pb.jet{right:calc(var(--bs)*.12);bottom:calc(var(--bs)*1.38)}
#pad.idle .pb,#pad.idle .dpad{opacity:.4}
/* phone portrait: wide screen on top, big pad below */
body.pt #pad{min-height:190px;max-height:none;padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
body.pt .dpad{transform:scale(var(--dps));transform-origin:0 50%}
body.pt .pb{width:var(--bs);height:var(--bs)}
body.pt .pb.a{width:calc(var(--bs)*1.25);height:calc(var(--bs)*1.25)}
.rot{font-size:8px;line-height:1.8;color:var(--teal);margin-top:6px;animation:blink 1.4s steps(1) infinite}
/* short screens (phones on their side): compact title & cards */
@media (max-height:460px){
  .logo{font-size:20px;padding:6px 10px}
  .logo small{margin-top:5px}
  .press{display:none}
  #title{gap:6px;justify-content:flex-start;padding-top:8px;overflow:auto}
  #title .menu{display:grid;grid-template-columns:1fr 1fr;min-width:min(330px,96%);gap:6px}
  #title .mbtn{padding:8px 6px;font-size:8px}
  .acct,.credit{font-size:6px;padding:4px 6px;line-height:1.7}
  .card{padding:10px}
  .lvlname{font-size:15px}
  .fact{font-size:7px;padding:6px 8px}
}
body{-webkit-touch-callout:none}
</style>

</head>
<body>
<div id="app">
  <div class="hud" id="hudTop">
    <span>SCORE: <b id="hScore">00000</b></span>
    <span>LEVEL: <b id="hLevel">1</b></span>
    <span class="lives">DEV: <span id="hLives"></span></span>
  </div>
  <div id="screen">
    <canvas id="cv"></canvas>
    <div class="crt" id="crt"></div>
    <div class="corner" id="corner" hidden><button id="bPause" type="button" aria-label="Pause">II</button><button id="bMusic" type="button" aria-label="Music">♪</button></div>
    <div class="ov clear" id="title">
      <div class="logo">DANGEROUS<br>DEV<small>GOA TREASURE HUNT</small></div>
      <div class="press" id="press">PRESS START</div>
      <div class="menu">
        <button class="mbtn primary" id="mStart" type="button">START GAME</button>
        <button class="mbtn" id="mLevels" type="button">LEVEL SELECT</button>
        <button class="mbtn" id="mHow" type="button">HOW TO PLAY</button>
        <button class="mbtn" id="mHi" type="button">HIGH SCORES</button>
      </div>
      <div class="acct" id="acct"><span id="acctInfo"></span><div id="gBtn"></div></div>
      <div class="credit">Inspired by the classic 1990 PC game <b>Dangerous Dave</b> by <b>John Romero</b>.<br>An original tribute by MHC Digital for Hinde Classes. All characters, art and levels are new.</div>
    </div>
    <div class="ov" id="panel" hidden><div class="card" id="panelCard"></div></div>
  </div>
  <div class="hud" id="hudBot">
    <span class="inv" id="hInv"></span>
    <span class="msg" id="hMsg">FIND THE GOLDEN GHUMOT!</span>
    <span class="inv"><span class="fuel" id="hFuelBox" hidden><i id="hFuel"></i></span></span>
  </div>
  <div id="pad" hidden>
    <div class="dpad" id="dpad" aria-label="Direction pad"><i class="h"></i><i class="v"></i><span id="dU" style="left:66px;top:28px">▲</span><span id="dD" style="left:66px;bottom:28px">▼</span><span id="dL" style="left:28px;top:68px">◀</span><span id="dR" style="right:28px;top:68px">▶</span></div>
    <div class="btns">
      <button class="pb fire dis" id="bFire" type="button" aria-label="Fire slingshot">FIRE</button>
      <button class="pb a" id="bJump" type="button" aria-label="Jump">JUMP</button>
      <button class="pb jet dis" id="bJet" type="button" aria-label="Jetpack">JET</button>
    </div>
  </div>
</div>

<script>
/* ===== Dangerous Dev engine (pure logic, no drawing) ===== */
const T = 16, ROWS = 12;
const PHYS = {run: 92, grav: 980, jumpV: 292, maxFall: 400, climb: 62, fly: 92, fuelPerSec: .085};
const SOLID = "#=WBRCA";      // laterite, grass ground, stone masonry, basalt/cave rock, roof tiles, painted wall, sand
const HAZARD = "~^fY";        // water, thorns, fire, stalactites
const ITEM_PTS = {k: 50, o: 75, m: 100, p: 120, b: 150, x: 250, T: 1000, "1": 0, S: 0, J: 0};
const ITEM_NAME = {p: "Poi bread", k: "Cashew", o: "Kokum", m: "Mankurad mango", b: "Bebinca", x: "Xerafim coin", T: "Golden Ghumot", "1": "Extra life", S: "Slingshot", J: "Jetpack"};

function parseLevel(def){
  const rows = def.map.map(r => r.split(""));
  const h = rows.length, w = rows[0].length;
  const L = {def, w, h, grid: rows, items: [], enemies: [], lamps: [], gates: [], warps: [], warpTo: [], start: null, door: null};
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const c = rows[y][x];
    if (c === "N"){ L.boss = {tx: x, ty: y}; rows[y][x] = "."; }
    else if (c === "i"){ (L.diyas = L.diyas || []).push({x, y}); rows[y][x] = "."; }
    else if (c === "Z"){ L.warps.push({x, y}); rows[y][x] = "."; }
    else if (c === "z"){ L.warpTo.push({x, y}); rows[y][x] = "."; }
    else if ("kompbxT1SJ".includes(c)){ L.items.push({x, y, t: c, got: false}); rows[y][x] = "."; }
    else if (c === "P"){ L.start = {x, y}; rows[y][x] = "."; }
    else if (c === "D"){ L.door = {x, y}; rows[y][x] = "."; }
    else if (c === "L"){ L.lamps.push({x, y, on: false}); rows[y][x] = "."; }
    else if (c === "G"){ L.gates.push({x, y, open: false}); rows[y][x] = "g"; if (y > 0) rows[y - 1][x] = "g"; }
    else if ("cwyva".includes(c)){ L.enemies.push(mkEnemy(c, x, y)); rows[y][x] = "."; }
  }
  return L;
}
function mkEnemy(t, tx, ty){
  const e = {t, x: tx*T, y: ty*T, x0: tx*T, y0: ty*T, vx: t === "c" ? 28 : 0, vy: 0, alive: true, ph: Math.random()*6, cd: 1 + Math.random()*1.5, w: 14, h: 10};
  if (t === "c"){ e.y = ty*T + 6; e.h = 10; }
  if (t === "w"){ e.range = 3*T; e.h = 9; }
  if (t === "v"){ e.r = 18; e.h = 8; }
  if (t === "y"){ e.w = 12; e.h = 14; e.y = ty*T + 2; e.y0 = e.y; }
  if (t === "a"){ e.w = 12; e.h = 10; e.range = 36; e.top = ty*T; }
  return e;
}
const tileAt = (L, tx, ty) => (tx < 0 || tx >= L.w) ? "#" : (ty < 0 || ty >= L.h) ? "." : L.grid[ty][tx];
const isSolid = c => SOLID.includes(c) || c === "g";
const isLadder = c => c === "H";

function mkPlayer(L, at){
  const s = at || L.start;
  return {x: s.x*T + 3, y: s.y*T + 1, w: 10, h: 15, vx: 0, vy: 0, onGround: false, climbing: false, flying: false, facing: 1, fuel: 0, hasJet: false, hasSling: false, dead: false, anim: 0};
}
function overlapTiles(p, fn){
  const x0 = Math.floor(p.x/T), x1 = Math.floor((p.x + p.w - .01)/T), y0 = Math.floor(p.y/T), y1 = Math.floor((p.y + p.h - .01)/T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (fn(tx, ty)) return true;
  return false;
}
function ladderAt(L, p){ const cx = Math.floor((p.x + p.w/2)/T); return isLadder(tileAt(L, cx, Math.floor((p.y + 2)/T))) || isLadder(tileAt(L, cx, Math.floor((p.y + p.h - 1)/T))); }
function ladderBelow(L, p){ const cx = Math.floor((p.x + p.w/2)/T); return isLadder(tileAt(L, cx, Math.floor((p.y + p.h + 1)/T))); }

/* inp: {left,right,up,down,jump(edge)} */
function stepPlayer(L, p, inp, dt){
  const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  if (dir) p.facing = dir;
  const prevBottom = p.y + p.h;
  if (p.flying){
    p.vx = dir*PHYS.fly; p.vy = inp.up ? -PHYS.fly : inp.down ? PHYS.fly : 0;
    p.fuel = Math.max(0, p.fuel - PHYS.fuelPerSec*dt);
    if (p.fuel <= 0) p.flying = false;
  } else if (p.climbing){
    p.vx = 0; p.vy = inp.up ? -PHYS.climb : inp.down ? PHYS.climb : 0;
    if (dir && !inp.up && !inp.down){ p.climbing = false; p.vx = dir*PHYS.run; }
    if (inp.jump){ p.climbing = false; p.vy = -PHYS.jumpV*.8; }

  } else {
    p.vx = dir*PHYS.run;
    if ((inp.up && ladderAt(L, p)) || (inp.down && (ladderBelow(L, p) || (ladderAt(L, p) && !p.onGround)))){
      p.climbing = true; p.vy = 0; p.x = Math.floor((p.x + p.w/2)/T)*T + (T - p.w)/2;
    } else if (inp.jump && p.onGround){ p.vy = -PHYS.jumpV; p.onGround = false; }
    else { p.vy = Math.min(PHYS.maxFall, p.vy + PHYS.grav*dt); }
  }
  // move X
  p.x += p.vx*dt;
  if (p.vx !== 0){
    const ty0 = Math.floor(p.y/T), ty1 = Math.floor((p.y + p.h - .01)/T);
    if (p.vx > 0){ const tx = Math.floor((p.x + p.w)/T); for (let ty = ty0; ty <= ty1; ty++) if (isSolid(tileAt(L, tx, ty))){ p.x = tx*T - p.w; break; } }
    else { const tx = Math.floor(p.x/T); for (let ty = ty0; ty <= ty1; ty++) if (isSolid(tileAt(L, tx, ty))){ p.x = (tx + 1)*T; break; } }
  }
  // move Y
  p.y += p.vy*dt; p.onGround = false;
  const tx0 = Math.floor(p.x/T), tx1 = Math.floor((p.x + p.w - .01)/T);
  if (p.vy > 0){
    const ty = Math.floor((p.y + p.h)/T);
    for (let tx = tx0; tx <= tx1; tx++){
      const c = tileAt(L, tx, ty);
      const top = ty*T;
      const oneway = (c === "-" || (isLadder(c) && !isLadder(tileAt(L, tx, ty - 1)))) && prevBottom <= top + .5 && !(p.climbing) && !(inp.down && isLadder(c));
      if (isSolid(c) || oneway){ p.y = top - p.h; p.vy = 0; p.onGround = true; if (p.climbing && isSolid(c)) p.climbing = false; break; }
    }
  } else if (p.vy < 0){
    const ty = Math.floor(p.y/T);
    for (let tx = tx0; tx <= tx1; tx++) if (isSolid(tileAt(L, tx, ty))){ p.y = (ty + 1)*T; p.vy = 0; break; }
  } else if (!p.climbing && !p.flying){
    // standing check
    const ty = Math.floor((p.y + p.h + .5)/T);
    for (let tx = tx0; tx <= tx1; tx++){ const c = tileAt(L, tx, ty); if (isSolid(c) || c === "-" || (isLadder(c) && !isLadder(tileAt(L, tx, ty - 1)))){ p.onGround = true; break; } }
  }
  if (p.climbing && p.onGround && !inp.up) p.climbing = false;
  p.x = Math.max(0, Math.min(L.w*T - p.w, p.x));
  p.anim += Math.abs(p.vx)*dt + (p.climbing ? Math.abs(p.vy)*dt : 0);
  return hazardHit(L, p) || p.y > L.h*T + 8 ? "die" : null;
}
function hazardHit(L, p){
  const inset = {x: p.x + 2, y: p.y + 3, w: p.w - 4, h: p.h - 3};
  return overlapTiles(inset, (tx, ty) => {
    const c = tileAt(L, tx, ty); if (!HAZARD.includes(c)) return false;
    if (c === "Y") return inset.y < ty*T + 9;   // stalactites hang from above
    const top = ty*T + (c === "~" ? 5 : c === "^" ? 8 : 4);
    return inset.y + inset.h > top;
  });
}
const aabb = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function stepEnemies(L, dt, p, shots){
  for (const e of L.enemies){
    if (!e.alive) continue;
    e.ph += dt;
    if (e.t === "c"){
      e.x += e.vx*dt;
      const ahead = e.vx > 0 ? e.x + e.w + 1 : e.x - 1, foot = Math.floor((e.y + e.h + 2)/T), mid = Math.floor((e.y + e.h/2)/T);
      if (isSolid(tileAt(L, Math.floor(ahead/T), mid)) || !isSolid(tileAt(L, Math.floor(ahead/T), foot)) && tileAt(L, Math.floor(ahead/T), foot) !== "-") e.vx = -e.vx;
    } else if (e.t === "w"){
      e.x = e.x0 + Math.sin(e.ph*.9)*e.range; e.y = e.y0 + Math.sin(e.ph*2.1)*6; e.vx = Math.cos(e.ph*.9);

    } else if (e.t === "v"){

    } else if (e.t === "y"){
      const hop = Math.max(0, Math.sin(e.ph*2.4)); e.y = e.y0 - hop*10;

      e.vx = dx;
      if (e.cd <= 0 && Math.abs(dx) < 150 && Math.abs(dy) < 40 && !p.dead){ e.cd = 2.2 + Math.random(); shots.push({x: e.x + e.w/2 - 3, y: e.y + 4, w: 6, h: 6, vx: Math.sign(dx)*105, vy: -40, g: 160, enemy: true, life: 3}); }

}
function stepShots(L, shots, dt){

   phone landscape (handheld) – the screen fills the full height in the middle; the d-pad sits in the left

function layout(){

  const lt = touch && land, pt = touch && !land;

    const side = Math.round(Math.max(118, Math.min(210, W*.2))), availW = W - 2*side, availH = H - 6;
    s = availH/192; VW = Math.floor(availW/s);

/* ---------- maths gates ---------- */
const R = (a, b) => a + Math.floor(Math.random()*(b - a + 1));
function makeQ(lvl){
  let q, a;
  if (lvl === 0){ if (Math.random() < .5){ const x = R(3, 12), y = R(2, 9); q = `${x} + ${y}`; a = x + y; } else { const x = R(9, 18), y = R(2, 8); q = `${x} − ${y}`; a = x - y; } }
  else if (lvl === 1){ const x = R(2, 5), y = R(3, 10); q = `${x} × ${y}`; a = x*y; }
  else { if (Math.random() < .5){ const x = R(3, 9), y = R(3, 9); q = `${x} × ${y}`; a = x*y; } else { const y = R(2, 9), a2 = R(2, 9); q = `${y*a2} ÷ ${y}`; a = a2; } }
  const opts = new Set([a]); while (opts.size < 3){ const d = a + (Math.random() < .5 ? -1 : 1)*R(1, 4); if (d >= 0) opts.add(d); }
  return {q, a, opts: [...opts].sort(() => Math.random() - .5)};
}
function openGate(gt){
  G.state = "gate"; const Q = makeQ(G.lvl); G.gateQ = {gt, ...Q};
  panel(`<h2>LOCKED GATE!</h2><p>Solve it to open the gate:</p><div class="q">${Q.q} = ?</div>
    <div class="opts">${Q.opts.map((o, i) => `<button class="mbtn" data-o="${o}" type="button">${o}</button>`).join("")}</div>
    <p class="tiny">${touch ? "" : "PRESS 1, 2 OR 3 · ESC TO STEP BACK"}</p><button class="mbtn" id="gx" type="button" style="font-size:8px">STEP BACK</button>`);
  document.querySelectorAll("[data-o]").forEach(b => b.onclick = () => answer(+b.dataset.o, b));
  $("#gx").onclick = closeGate;
}
function answer(v, btn){
  if (G.state !== "gate") return;
  if (v === G.gateQ.a){
    SFX.ok(); const gt = G.gateQ.gt; gt.open = true; G.L.grid[gt.y][gt.x] = "."; G.L.grid[gt.y - 1][gt.x] = ".";
    addScore(200, gt.x*16, gt.y*16 - 16); burst(gt.x*16 + 8, gt.y*16 - 4, ["#ffd23a", "#fff", "#c08a4e"], 18);
    hidePanel(); G.state = "play";

}

  for (const [, pt] of dTouches){ const dx = pt.x - cx, dy = pt.y - cy; if (Math.hypot(dx, dy) < 12) continue; const a = Math.atan2(dy, dx)*180/Math.PI;
    if (a > 120 || a < -120) l = true; if (a > -60 && a < 60) r = true; if (a < -35 && a > -145) u = true; if (a > 35 && a < 145) d = true; }
  K.left = l; K.right = r; K.up = u; K.down = d;

}

/* ---------- Narkasur boss (level 10) ---------- */
const BOSS_HP = 14;
function bossBox(b){ return {x: b.x + 9, y: b.y + 4, w: 30, h: 54}; }
function stepBoss(dt, p){
  const b = G.boss; if (!b) return;
  b.flash = Math.max(0, b.flash - dt); b.poseT -= dt; if (b.poseT <= 0) b.pose = 0;
  if (b.dead){ b.deadT += dt;
    if (b.deadT < 3.2 && Math.random() < dt*6) launchFw(b.x + 24 + (Math.random() - .5)*30, b.y + 30);
    if (b.deadT > 1.4 && !b.dropped){ b.dropped = true; G.L.items.push({x: Math.round((b.x + 24)/16), y: 9, t: "T", got: false}); setMsg("GRAB THE LAST GOLDEN GHUMOT!", true); }
    return; }
  if (!b.active){ if (b.x - G.cam < VW - 20){ b.active = true; setMsg("DEFEAT NARKASUR!", true); [196, 165, 147, 131].forEach((f, i) => blip(f, .25, "sawtooth", .1, 1, i*.18)); } else return; }
  b.x = b.x0 + Math.sin(G.t*1.3)*10;
  b.cd -= dt;
  if (b.cd <= 0){
    b.n++; b.pose = 1; b.poseT = .35;
    if (b.n % 3 === 0){ G.bshots.push({k: "chakra", x: b.x + 4, y: 150, w: 10, h: 10, vx: -95, vy: 0, life: 7}); blip(900, .3, "sawtooth", .05, .5); }
    else { const tx = p.x + p.w/2 + (Math.random() - .5)*20, T = 1.05, vx = Math.max(-170, Math.min(-30, (tx - b.x - 6)/T)); G.bshots.push({k: "cracker", x: b.x + 6, y: b.y + 12, w: 6, h: 6, vx, vy: -230, g: 330, life: 4}); blip(420, .12, "triangle", .08, 1.5); }
    b.cd = b.hp > BOSS_HP/2 ? 1.6 : 1.05;
  }
}
function boom(x, y){ noiseB(.3, .16, 1800); burst(x, y, ["#ffd23a", "#ff6a2a", "#ffffff", "#e83a8a"], 18, 90); G.flashes.push({x, y, t: .25}); }
function stepBossShots(dt, p){
  const L = G.L, box = {x: p.x + 1, y: p.y + 2, w: p.w - 2, h: p.h - 2};
  for (const s of G.bshots){
    s.life -= dt; s.vy += (s.g || 0)*dt; s.x += s.vx*dt; s.y += s.vy*dt;
    if (s.k === "chakra"){ s.y = 160 - s.h; if (Math.random() < dt*25) G.parts.push({x: s.x + 5, y: s.y + 9, vx: 30 + Math.random()*20, vy: -20 - Math.random()*30, t: .3, c: Math.random() < .5 ? "#ffd23a" : "#fff3a0"}); if (s.x < 8) s.life = 0; }
    else if (Math.random() < dt*30) G.parts.push({x: s.x + 3, y: s.y, vx: 0, vy: -10, t: .2, c: "#ffb12a"});
    if (s.k === "cracker" && s.vy > 0 && (s.y + s.h >= 160 || isSolid(tileAt(L, Math.floor((s.x + 3)/16), Math.floor((s.y + 3)/16))) || tileAt(L, Math.floor((s.x + 3)/16), Math.floor((s.y + 6)/16)) === "-")){ s.life = 0; boom(s.x + 3, s.y + 3);
      if (G.inv <= 0 && Math.abs(p.x + p.w/2 - s.x - 3) < 11 && Math.abs(p.y + p.h/2 - s.y) < 14){ die(); return; } continue; }
    if (G.inv <= 0 && s.life > 0 && aabb(box, s)){ die(); return; }
    for (const sh of G.shots) if (!sh.enemy && sh.life > 0 && s.life > 0 && aabb(sh, s)){ sh.life = 0; s.life = 0; boom(s.x + 3, s.y + 3); addScore(50, s.x, s.y); }
  }
  G.bshots = G.bshots.filter(s => s.life > 0);
}
function hitBoss(){
  const b = G.boss; if (!b || b.dead || !b.active) return;
  const bb = bossBox(b);
  for (const s of G.shots){ if (s.enemy || s.life <= 0 || !aabb(s, bb)) continue;
    s.life = 0; b.hp--; b.flash = .12; SFX.hit(); addScore(100, s.x, s.y - 6); burst(s.x, s.y, ["#fff", "#2f6a8a", "#d8302a"], 8);
    if (b.hp <= 0){ b.dead = true; b.deadT = 0; G.bshots = []; addScore(5000, b.x + 16, b.y); SFX.trophy(); setMsg("NARKASUR DEFEATED! HAPPY DIWALI!", false); G.msgT = 3;
      for (let k = 0; k < 6; k++) setTimeout(() => launchFw(b.x + 24 + (Math.random() - .5)*40, b.y + 20), k*180); break; }
  }
}
/* fireworks: rockets that rise and burst into coloured sparks */
const FWC = [["#ff4a4a", "#ffd23a"], ["#4ac8ff", "#ffffff"], ["#4aff8a", "#ffd23a"], ["#ff7ae0", "#ffffff"], ["#ffb12a", "#fff3a0"]];
function launchFw(x, y){ G.fw.push({x, y, vx: (Math.random() - .5)*40, vy: -150 - Math.random()*70, t: .55 + Math.random()*.4, rocket: true, c: FWC[Math.floor(Math.random()*FWC.length)]}); blip(300, .4, "triangle", .03, 3); }
function stepFw(dt){
  if (G.fwOn && Math.random() < dt*2.5) launchFw(G.cam + 20 + Math.random()*(VW - 40), 180);
  const out = [];
  for (const f of G.fw){ f.t -= dt; f.x += f.vx*dt; f.y += f.vy*dt; f.vy += (f.rocket ? 60 : 70)*dt; if (!f.rocket) f.vx *= .985;
    if (f.t <= 0 && f.rocket){ const n = 26; for (let i = 0; i < n; i++){ const a = i/n*6.283, v = 55 + Math.random()*25; out.push({x: f.x, y: f.y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, t: .8 + Math.random()*.5, c: f.c[i % 2]}); } noiseB(.25, .06, 1400); continue; }
    if (f.t > 0) out.push(f); }

/* ---------- update ---------- */
const DT = 1/120;
function update(dt){
  G.t += dt;
  if (G.fw && (G.fw.length || G.fwOn)) stepFw(dt);
  if (G.state === "title"){ G.attract += dt; G.cam = (Math.sin(G.attract*.12)*.5 + .5)*(G.L.w*16 - VW); return; }
  if (G.state === "walk"){ G.walkT += dt; if (G.walkT > 3.4) afterWalk(); return; }
  if (G.state !== "play" && G.state !== "dead") return;
  if (performance.now() - (G.lastInput || 0) < 15000) G.playSecs = (G.playSecs || 0) + dt;
  const L = G.L, p = G.p;
  G.trainX += dt*(G.theme === "mangrove" ? 14 : 70); if (G.trainX > 1400) G.trainX = -300 - Math.random()*600;
  // particles & pops
  for (const q of G.parts){ q.t -= dt; q.vy += 200*dt; q.x += q.vx*dt; q.y += q.vy*dt; } G.parts = G.parts.filter(q => q.t > 0);
  for (const q of G.pops){ q.t -= dt; q.y -= 18*dt; } G.pops = G.pops.filter(q => q.t > 0);
  if (G.state === "dead"){ G.deadT -= dt; if (G.deadT <= 0) respawn(); return; }
  G.inv = Math.max(0, G.inv - dt); G.fireCd -= dt; G.gateCd -= dt;
  // jetpack toggle / fire
  if (K.jetQ){ K.jetQ = false; if (p.hasJet && p.fuel > 0){ p.flying = !p.flying; p.climbing = false; if (p.flying) blip(300, .2, "sawtooth", .06, 1.6); } }
  if (K.fireQ){ K.fireQ = false; if (p.hasSling && G.fireCd <= 0){ G.fireCd = .32; SFX.shoot(); G.shots.push({x: p.x + (p.facing > 0 ? p.w : -6), y: p.y + 5, w: 6, h: 5, vx: p.facing*230, vy: 0, life: 1.1}); } }
  const onLadder = p.climbing || (typeof ladderAt === "function" && ladderAt(L, p));
  const inp = {left: K.left, right: K.right, up: K.up, down: K.down, jump: K.jumpQ || (upEdge && !onLadder && !p.flying)};
  K.jumpQ = false; upEdge = false;
  const wasGround = p.onGround;
  const r = stepPlayer(L, p, inp, dt);
  if (inp.jump && wasGround && !p.onGround && p.vy < 0) SFX.jump();
  if (p.flying && Math.random() < dt*30) G.parts.push({x: p.x + (p.facing > 0 ? 1 : p.w - 1), y: p.y + 13, vx: (Math.random() - .5)*20, vy: 40, t: .25, c: Math.random() < .5 ? "#ffb12a" : "#fff3a0"});
  if (r === "die") return die();
  // items
  const box = {x: p.x, y: p.y, w: p.w, h: p.h};
  for (const it of L.items){
    if (it.got) continue;
    if (aabb(box, {x: it.x*16 + 3, y: it.y*16 + 3, w: 10, h: 10})){
      it.got = true; const cx = it.x*16 + 8, cy = it.y*16 + 4;
      if (it.t === "T"){ G.trophy = true; SFX.trophy(); addScore(1000, cx, cy); setMsg("GO THROUGH THE DOOR!", true); burst(cx, cy, ["#ffd23a", "#fff3b0", "#c48a12"], 24, 90); }
      else if (it.t === "S"){ p.hasSling = true; SFX.life(); setMsg(touch ? "SLINGSHOT! TAP FIRE" : "SLINGSHOT! PRESS X TO FIRE", false); G.msgT = 4; hud(); }
      else if (it.t === "J"){ p.hasJet = true; p.fuel = 1; SFX.life(); setMsg(touch ? "JETPACK! TAP JET TO FLY" : "JETPACK! PRESS Z TO FLY", false); G.msgT = 4; hud(); }
      else if (it.t === "1"){ G.lives++; SFX.life(); hud(); G.pops.push({x: cx, y: cy, s: "+1", t: 1}); }
      else { (it.t === "x" ? SFX.coin : SFX.pick)(); addScore(ITEM_PTS[it.t], cx, cy); burst(cx, cy, ["#fff", "#ffd23a"], 6, 40); G.got = (G.got || 0) + 1; }
    }
  }
  if (G.msgT > 0){ G.msgT -= dt; if (G.msgT <= 0) setMsg(G.trophy ? "GO THROUGH THE DOOR!" : "FIND THE GOLDEN GHUMOT!", true); }
  // secret passages (warp zones)
  G.warpCd -= dt;
  if (G.warpCd <= 0) L.warps.forEach((w, i) => { const to = L.warpTo[i]; if (!to) return;
    if (Math.abs(p.x + p.w/2 - (w.x*16 + 8)) < 8 && Math.abs(p.y + p.h - (w.y*16 + 16)) < 12){
      burst(p.x + 5, p.y + 8, ["#7fe0ff", "#ffffff", "#c98aff"], 20, 80);
      p.x = to.x*16 + 3; p.y = to.y*16 + 1; p.vx = p.vy = 0; p.flying = false; p.climbing = false; G.warpCd = 1;
      burst(p.x + 5, p.y + 8, ["#7fe0ff", "#ffffff", "#c98aff"], 20, 80);
      [880, 660, 990, 1320].forEach((f, k) => blip(f, .09, "triangle", .1, 1, k*.06)); setMsg("SECRET PASSAGE!", false); G.msgT = 2;
      G.cam = Math.max(0, Math.min(L.w*16 - VW, p.x - VW/2)); } });
  // lamps (checkpoints)
  for (const lp of L.lamps) if (!lp.on && Math.abs(p.x + p.w/2 - (lp.x*16 + 8)) < 10 && Math.abs(p.y + p.h - (lp.y*16 + 16)) < 20){ lp.on = true; G.lamp = lp; SFX.lamp(); G.pops.push({x: lp.x*16 + 2, y: lp.y*16 - 20, s: "+0", t: .01}); setMsg("CHECKPOINT!", false); G.msgT = 1.6; }
  // gates
  if (G.gateCd <= 0) for (const gt of L.gates){ if (gt.open) continue; if (aabb({x: p.x - 2, y: p.y, w: p.w + 4, h: p.h}, {x: gt.x*16, y: gt.y*16 - 16, w: 16, h: 32})) { openGate(gt); return; } }
  // door
  if (L.door && aabb(box, {x: L.door.x*16 + 4, y: L.door.y*16 - 12, w: 8, h: 28})){
    if (G.trophy) return levelDone();
    if (G.msgT <= 0){ setMsg("FIND THE GOLDEN GHUMOT FIRST!", false); G.msgT = 1.5; }
  }
  // enemies & shots
  stepEnemies(L, dt, p, G.shots); stepShots(L, G.shots, dt);
  if (G.boss){ stepBoss(dt, p); hitBoss(); stepBossShots(dt, p); if (G.state !== "play") return;
    if (!G.boss.dead && G.inv <= 0 && aabb({x: p.x + 1, y: p.y + 2, w: p.w - 2, h: p.h - 2}, bossBox(G.boss))) return die();
    if (!G.boss.dead && p.x + p.w > G.boss.x + 9) p.x = G.boss.x + 9 - p.w; }
  for (const s of G.shots){
    if (s.enemy){ if (G.inv <= 0 && aabb(box, s)) return die(); continue; }
    for (const e of L.enemies) if (e.alive && aabb(s, e)){ e.alive = false; s.life = 0; SFX.hit(); addScore({c: 100, w: 150, v: 200, y: 250, a: 150}[e.t], e.x + 4, e.y); burst(e.x + 7, e.y + 5, ["#fff", "#aaa", "#e8402a"], 12); }
  }
  if (G.inv <= 0) for (const e of L.enemies) if (e.alive && aabb({x: p.x + 1, y: p.y + 2, w: p.w - 2, h: p.h - 2}, e)) return die();
  // camera
  const target = p.x + p.w/2 - VW/2 + p.facing*VW*.12;
  G.cam += (target - G.cam)*Math.min(1, dt*5);
  G.cam = Math.max(0, Math.min(L.w*16 - VW, G.cam));
  if (p.hasJet){ $("#hFuel").style.transform = `scaleX(${p.fuel})`; $("#bJet").classList.toggle("onjet", p.flying); }

function die(){ buzz([40, 30, 60]);
  if (G.state !== "play") return;
  G.state = "dead"; G.deadT = 1.5; SFX.die(); stopMusic();
  burst(G.p.x + 5, G.p.y + 8, ["#ffd23a", "#e8402a", "#fff", "#ef6a23"], 30, 110);

function respawn(){

  const old = G.p; G.p = mkPlayer(G.L, at); G.p.hasSling = old.hasSling; G.p.hasJet = old.hasJet; G.p.fuel = Math.max(old.fuel, old.hasJet ? .35 : 0);
  G.shots = []; G.bshots = []; if (G.boss && !G.boss.dead) G.boss.cd = 2; G.inv = 1.6; G.state = "play"; startMusic(); hud();
}

/* ---------- darkness with light pools (Old Goa night, Diwali night) ---------- */
function lighting(cam, a){
  if (!LC || LC.width !== VW || LC.height !== VH){ LC = document.createElement("canvas"); LC.width = VW; LC.height = VH; }
  const g = LC.getContext("2d"), L = G.L, p = G.p, lights = [];
  g.globalCompositeOperation = "source-over"; g.clearRect(0, 0, VW, VH); g.fillStyle = `rgba(4,5,24,${a})`; g.fillRect(0, 0, VW, VH);
  if (p && G.state !== "title") lights.push([p.x + p.w/2, p.y + 6, 72]);
  for (const lp of L.lamps) lights.push([lp.x*16 + 8, lp.y*16 - 10, lp.on ? 64 : 20]);
  if (L.diyas) for (const d of L.diyas) lights.push([d.x*16 + 8, d.y*16 + 10, 30 + Math.sin(G.t*9 + d.x)*2]);
  if (L.door) lights.push([L.door.x*16 + 8, L.door.y*16, G.trophy ? 40 : 18]);
  for (const it of L.items) if (!it.got && it.t === "T") lights.push([it.x*16 + 8, it.y*16 + 8, 26]);
  const x0 = Math.floor(cam/16), x1 = Math.min(L.w - 1, x0 + Math.ceil(VW/16) + 1);
  for (let y = 0; y < L.h; y++) for (let x = x0; x <= x1; x++) if (L.grid[y][x] === "f") lights.push([x*16 + 8, y*16 + 8, 34]);
  if (G.boss){ const b = G.boss; lights.push([b.x + 24, b.y + 30, b.dead ? 70 : 46]); for (const s of G.bshots) lights.push([s.x + 3, s.y + 3, 18]); }
  for (const f of G.fw) if (!f.rocket) lights.push([f.x, f.y, 10]);
  for (const q of G.flashes) lights.push([q.x, q.y, 50]);
  g.globalCompositeOperation = "destination-out";
  for (const [lx, ly, r] of lights){ const x = lx - cam; if (x < -r || x > VW + r) continue; const gr = g.createRadialGradient(x, ly, 0, x, ly, r);
    gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(.55, "rgba(0,0,0,.7)"); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.beginPath(); g.arc(x, ly, r, 0, 6.283); g.fill(); }
  ctx.drawImage(LC, 0, 0);
}

/* ---------- render ---------- */
function render(){
  ctx.imageSmoothingEnabled = false;
  const L = G.L; if (!L){ ctx.fillStyle = "#000"; ctx.fillRect(0, 0, VW, VH); return; }
  const cam = Math.round(G.cam), th = G.theme, [far, mid, near] = BG[th];
  const layer = (img, f, yOff = 0) => { const off = Math.floor(cam*f) % img.width; for (let x = -off; x < VW; x += img.width) ctx.drawImage(img, x, yOff); };
  layer(far, .12); layer(mid, .3);
  if (th === "falls"){ const tx = Math.round(G.trainX - cam*.3); ctx.drawImage(TRAIN, ((tx % 900) + 900) % 900 - 140, 82); }
  if (th === "mangrove"){ const tx = Math.round(G.trainX*1.5 - cam*.2); ctx.drawImage(FERRY, ((tx % 700) + 700) % 700 - 100, 104 + Math.round(Math.sin(G.t*1.5))); }
  if (th === "diwali" && G.state === "play" && Math.random() < .012 && G.fw.length < 120) launchFw(cam + Math.random()*VW, 110);
  layer(near, .55, 0);
  // level tiles
  ctx.drawImage(G.levelCv, cam, 0, VW, VH, 0, 0, VW, VH);
  const x0 = Math.floor(cam/16), x1 = Math.min(L.w - 1, x0 + Math.ceil(VW/16) + 1), fr = Math.floor(G.t*6);
  for (let y = 0; y < L.h; y++) for (let x = x0; x <= x1; x++){
    const c = L.grid[y][x];
    if (c === "~") ART.waterTile(ctx, x*16 - cam, y*16, th, fr + x, y === 0 || L.grid[y - 1][x] !== "~");
    else if (c === "f") ART.fireTile(ctx, x*16 - cam, y*16, fr + x);
  }
  // secret passages shimmer faintly
  for (const w of L.warps){ const wx = w.x*16 - cam, wy = w.y*16; if (wx < -16 || wx > VW) continue;
    for (let k = 0; k < 3; k++){ const a = G.t*3 + k*2.1; ctx.fillStyle = k === 1 ? "#ffffff" : "#9fe8ff"; ctx.fillRect(Math.round(wx + 7 + Math.cos(a)*5), Math.round(wy + 8 + Math.sin(a)*6), 1, 1); } }
  // diyas
  if (L.diyas) for (const d of L.diyas){ const dx = d.x*16 - cam; if (dx > -16 && dx < VW) ART.diya(ctx, dx, d.y*16, fr + d.x); }
  // door, lamps, gates
  if (L.door){ const dx = L.door.x*16 - cam, dy = L.door.y*16 - 16; ctx.drawImage(DOOR[G.trophy ? 1 : 0], dx, dy); if (G.trophy && Math.floor(G.t*4) % 2) { ctx.fillStyle = "#ffd23a"; ctx.fillRect(dx + 7, dy - 4, 2, 2); } }
  for (const lp of L.lamps) ctx.drawImage(LAMP[lp.on ? 1 : 0], lp.x*16 - cam, lp.y*16 - 16);
  for (const gt of L.gates) if (!gt.open) ctx.drawImage(GATE, gt.x*16 - cam, gt.y*16 - 16);
  // items (bobbing)
  for (const it of L.items){ if (it.got) continue; const sx = it.x*16 - cam; if (sx < -16 || sx > VW) continue;
    const bob = it.t === "T" ? Math.round(Math.sin(G.t*4)*2) : Math.round(Math.sin(G.t*3 + it.x)*1);
    const name = {k: "kaju", o: "kokum", m: "mango", p: "poi", b: "bebinca", x: "coin", T: "ghumot", "1": "oneup", S: "sling", J: "jetpack"}[it.t];
    if (it.t === "T" && Math.floor(G.t*8) % 4 === 0){ ctx.fillStyle = "#fff3b0"; ctx.fillRect(sx + 2 + Math.floor(Math.random()*12), it.y*16 + bob + Math.floor(Math.random()*12), 1, 1); }
    ctx.drawImage(ART.sprite(name), sx, it.y*16 + bob); }
  // enemies
  for (const e of L.enemies){ if (!e.alive) continue; const sx = Math.round(e.x - cam); if (sx < -20 || sx > VW + 4) continue;
    const f = Math.floor(G.t*6 + e.x0) % 2 + 1;
    const base = {c: "crab", w: "crow", v: "bat", y: "monkey", a: "spider"}[e.t];
    if (e.t === "a"){ ctx.fillStyle = "#cfc6b8"; ctx.fillRect(sx + 7, e.top, 1, Math.round(e.y) - e.top); }
    const flip = e.t === "w" ? e.vx < 0 : e.t === "y" ? e.vx < 0 : false;
    const oy = e.t === "c" ? -6 : e.t === "w" ? -4 : e.t === "v" ? -4 : e.t === "a" ? -4 : -2;
    ctx.drawImage(ART.sprite(base + f, flip), sx - 1, Math.round(e.y) + oy); }
  // Narkasur
  const B = G.boss;
  if (B){ const bx = Math.round(B.x - cam), sink = B.dead ? Math.min(40, B.deadT*14) : 0;
    if (!B.dead || B.deadT < 3){
      ctx.save(); ctx.beginPath(); ctx.rect(bx - 4, 0, 60, 160); ctx.clip();
      ctx.drawImage(B.flash > 0 ? NARKW[B.pose] : NARK[B.pose], bx, Math.round(B.y + sink + (B.dead ? 0 : Math.sin(G.t*2.6))));
      ctx.restore();
      if (B.dead) for (let k = 0; k < 4; k++) ART.fireTile(ctx, bx + 4 + k*10, 144, fr + k);
    }
    for (const s of G.bshots){ const sx = Math.round(s.x - cam), sy = Math.round(s.y); if (s.k === "chakra") ctx.drawImage(ART.chakra(fr), sx - 1, sy - 1); else ctx.drawImage(CRACK, sx - 1, sy - 1); }
  }
  // shots
  for (const s of G.shots) ctx.drawImage(ART.sprite(s.enemy ? "nut" : "pebble"), Math.round(s.x - cam) - 5, Math.round(s.y) - 7);
  // player
  const p = G.p;
  if (G.state === "dead"){ if (Math.floor(G.t*12) % 2) ctx.drawImage(ART.sprite("dev_die"), Math.round(p.x - cam) - 3, Math.round(p.y) - 1); }
  else if (!(G.inv > 0 && Math.floor(G.t*14) % 2)){
    let n = "dev_stand";
    if (p.flying) n = "dev_fly";
    else if (p.climbing) n = Math.floor(p.anim/6) % 2 ? "dev_climb1" : "dev_climb2";
    else if (!p.onGround) n = "dev_jump";
    else if (Math.abs(p.vx) > 1) n = ["dev_run1", "dev_run2", "dev_run3", "dev_run2"][Math.floor(p.anim/7) % 4];
    ctx.drawImage(ART.sprite(n, p.facing < 0 && !p.climbing), Math.round(p.x - cam) - 3, Math.round(p.y) - 1);
  }
  // night lighting
  if (th === "night" || th === "diwali") lighting(cam, th === "night" ? .5 : .42);
  // fireworks & blast flashes (drawn over the darkness)
  for (const f of G.fw){ ctx.fillStyle = f.rocket ? "#fff3a0" : f.c; const sz = f.rocket || f.t > .5 ? 2 : 1; ctx.fillRect(Math.round(f.x - cam), Math.round(f.y), sz, sz); }
  for (const q of G.flashes){ ctx.fillStyle = `rgba(255,220,140,${Math.min(1, q.t*2)})`; ctx.beginPath(); ctx.arc(q.x - cam, q.y, 6 + (0.25 - q.t)*40, 0, 6.283); ctx.fill(); }
  if (B && B.active && !B.dead){ // boss health bar
    ctx.fillStyle = "#000"; ctx.fillRect(VW/2 - 52, 5, 104, 12); ctx.fillStyle = "#4a3f63"; ctx.fillRect(VW/2 - 51, 6, 102, 10);
    ctx.fillStyle = "#e8402a"; ctx.fillRect(VW/2 - 50, 7, Math.round(100*B.hp/BOSS_HP), 8); ctx.fillStyle = "#ff8a6a"; ctx.fillRect(VW/2 - 50, 7, Math.round(100*B.hp/BOSS_HP), 2);
    ctx.font = '8px "Press Start 2P", monospace'; ctx.textAlign = "center"; ctx.fillStyle = "#000"; ctx.fillText("NARKASUR", VW/2 + 1, 15); ctx.fillStyle = "#fff"; ctx.fillText("NARKASUR", VW/2, 14); ctx.textAlign = "left"; }
  // particles & pops
  for (const q of G.parts){ ctx.fillStyle = q.c; ctx.fillRect(Math.round(q.x - cam), Math.round(q.y), 1 + (q.t > .4 ? 1 : 0), 1 + (q.t > .4 ? 1 : 0)); }
  for (const q of G.pops) if (q.s !== "+0") pixText(q.s, Math.round(q.x - cam), Math.round(q.y), Math.floor(G.t*10) % 2 ? "#ffd23a" : "#ffffff");
  // between-levels walk
  if (G.state === "walk"){
    ctx.fillStyle = "#06040c"; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = "#3a2b20"; ctx.fillRect(0, 150, VW, 6); ctx.fillStyle = "#a5482b"; ctx.fillRect(0, 156, VW, 36);
    for (let x = (-Math.floor(G.walkT*30) % 24); x < VW; x += 24){ ctx.fillStyle = "#c9693f"; ctx.fillRect(x, 160, 12, 2); }
    const wx = Math.round(-16 + (VW + 32)*(G.walkT/3.4));
    ctx.drawImage(ART.sprite(["dev_run1", "dev_run2", "dev_run3", "dev_run2"][Math.floor(G.walkT*10) % 4]), wx, 134);
    ctx.drawImage(ART.sprite("ghumot"), wx + 10, 128 + Math.round(Math.sin(G.walkT*10)));
  }
}

/* ---------- loop ---------- */
let last = performance.now(), acc = 0;
function frame(now){
  acc += Math.min(.1, (now - last)/1000); last = now;
  while (acc >= DT){ update(DT); acc -= DT; }
  render();
  const idle = G.state !== "play"; if (idle !== frame.idle){ frame.idle = idle; $("#pad").classList.toggle("idle", idle); }
  requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange", () => { if (document.hidden && G.state === "play") togglePause(); });

/* ---------- boot ---------- */
layout(); prepArt(); showTitle(); hud();
$("#bMusic").style.opacity = musicOn ? 1 : .4;
requestAnimationFrame(frame);

</script>
<script>
/* ===== Google sign-in + the shared Diwali Games leaderboard ===== */

const shortName = full => { const p = String(full || "Player").trim().split(/\s+/); return p.length > 1 ? `${p[0]} ${p[p.length - 1][0]}.` : p[0]; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
try { const s = JSON.parse(sessionStorage.getItem("dg_tok") || "null"); if (s && s.exp > Date.now()){ idToken = s.t; tokenExp = s.exp; } } catch {}
try { const h = JSON.parse(sessionStorage.getItem("hinde_user") || "null");
  if (h && h.name && h.email && h.email !== "demo@hindeclasses.in" && (!user || user.guest)){ user = {name: shortName(h.name), picture: h.picture || "", guest: false, email: h.email}; store.set("dg_user", user); } } catch {}
const tokenOk = () => !!idToken && Date.now() < tokenExp - 30000;
const signedIn = () => !!user && !user.guest;
function decodeJwt(t){ let b = t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"); while (b.length % 4) b += "="; return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0)))); }
function onCredential(resp){
  const p = decodeJwt(resp.credential); idToken = resp.credential; tokenExp = p.exp*1000;
  try { sessionStorage.setItem("dg_tok", JSON.stringify({t: idToken, exp: tokenExp})); } catch {}
  user = {name: shortName(p.name || p.given_name), picture: p.picture || "", guest: false, email: p.email || ""}; store.set("dg_user", user);
  renderAccount(); flushPending(); unsent = null;
}
function noGoogle(){ googleReady = false; renderAccount(); }
function initGoogle(){
  if (!CFG.CLIENT_ID) return noGoogle();
  const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
  s.onload = () => { try {
    google.accounts.id.initialize({client_id: CFG.CLIENT_ID, callback: onCredential, auto_select: true, cancel_on_tap_outside: true, use_fedcm_for_prompt: true});
    google.accounts.id.renderButton($("#gBtn"), {theme: "filled_black", size: "medium", shape: "rectangular", text: "signin_with"});
    googleReady = true; renderAccount(); if (!tokenOk()) google.accounts.id.prompt();
  } catch { noGoogle(); } };
  s.onerror = noGoogle; document.head.appendChild(s);
  setTimeout(() => { if (!window.google?.accounts?.id) noGoogle(); }, 7000);
}
function renderAccount(){
  const el = $("#acctInfo"); if (!el) return;
  $("#gBtn").hidden = !googleReady || (signedIn() && tokenOk());
  if (signedIn()){ el.innerHTML = `PLAYING AS <b>${esc(user.name).toUpperCase()}</b> · SCORES GO ON THE DIWALI GAMES BOARD <button class="lnk" id="so" type="button">SIGN OUT</button>`;
    $("#so").onclick = () => { try { google.accounts.id.disableAutoSelect(); } catch {} user = null; idToken = null; store.set("dg_user", null); try { sessionStorage.removeItem("dg_tok"); } catch {} renderAccount(); }; }
  else el.innerHTML = googleReady ? "SIGN IN WITH GOOGLE TO PUT YOUR SCORE ON THE DIWALI GAMES LEADERBOARD" : "PLAYING AS GUEST · ONLINE SCORES WORK ON HINDECLASSES.COM";
}
async function post(body){ const r = await fetch(CFG.API_URL, {method: "POST", body: JSON.stringify({...body, idToken})}); return r.json(); }
function queue(rd){ const q = store.get("dg_pending", []); q.push(rd); store.set("dg_pending", q.slice(-10)); }
let flushing = false;
async function flushPending(){
  if (flushing || !CFG.API_URL || !signedIn() || !tokenOk()) return; flushing = true;
  try { let q = store.get("dg_pending", []);
    while (q.length){ const r = await post({action: "submit", ...q[0]}); if (!r.ok && r.auth) break;
      if (!r.ok && /quick/i.test(r.error || "")){ await new Promise(res => setTimeout(res, 16000)); continue; }
      if (r.ok) store.set("dg_P", r.player); q.shift(); store.set("dg_pending", q); } } catch {}
  flushing = false;
}
async function submitRun(rd){
  if (!CFG.API_URL) return {status: "site"};
  if (!signedIn()) return {status: "guest"};
  if (!tokenOk()){ queue(rd); return {status: "queued"}; }
  try { const r = await post({action: "submit", ...rd});
    if (r.ok){ store.set("dg_P", r.player); return {status: "posted", xp: r.xp, week: r.week}; }
    if (r.auth){ queue(rd); return {status: "queued"}; } return {status: "error", msg: r.error};
  } catch { queue(rd); return {status: "offline"}; }
}
function showXp(out){
  const b = $("#xpBox"); if (!b) return;
  const link = `<a href="${CFG.PORTAL}#leaders" target="_top" style="color:var(--teal)">SEE THE LEADERBOARD</a>`;
  if (out.status === "posted") b.innerHTML = `XP EARNED <b>+${out.xp.total}</b>${out.week && out.week.pos ? ` · YOU'RE <b>#${out.week.pos}</b> THIS WEEK` : ""}<br>${link}`;
  else if (out.status === "guest") b.innerHTML = googleReady ? `GUEST SCORES DON'T GO ON THE LEADERBOARD. SIGN IN WITH GOOGLE BEFORE YOUR NEXT GAME TO COMPETE FOR PRIZES.<div id="gBtn2" style="margin-top:6px;display:flex;justify-content:center"></div>` : `GUEST SCORE, SAVED ON THIS DEVICE ONLY. SIGN IN WITH GOOGLE TO JOIN THE LEADERBOARD.`;
  else if (out.status === "queued") b.innerHTML = `SIGN-IN EXPIRED. YOUR SCORE WILL POST WHEN YOU SIGN IN AGAIN.<div id="gBtn2" style="margin-top:6px;display:flex;justify-content:center"></div>`;
  else if (out.status === "offline") b.innerHTML = `NO CONNECTION. YOUR SCORE WILL POST NEXT TIME YOU'RE ONLINE.`;
  else if (out.status === "site") b.innerHTML = `SCORE SAVED ON THIS DEVICE. ON HINDECLASSES.COM IT GOES ON THE LEADERBOARD.`;
  else b.textContent = out.msg || "THE LEADERBOARD DIDN'T ACCEPT THIS SCORE.";
  if ($("#gBtn2") && googleReady) try { google.accounts.id.renderButton($("#gBtn2"), {theme: "filled_black", size: "medium", text: "signin_with"}); } catch {}
}
async function loadOnlineHi(){
  const el = $("#onlineHi"); if (!el) return;
  if (!CFG.API_URL){ el.innerHTML = "<li><span>On hindeclasses.com</span></li>"; return; }
  try { const j = await (await fetch(`${CFG.API_URL}?board=game&period=all&game=dangerous-dev`)).json(); if (!j.ok) throw 0;
    el.innerHTML = j.rows.length ? j.rows.slice(0, 5).map(r => `<li><span>${esc(r.name).toUpperCase()}</span><span>${String(r.v).padStart(5, "0")}</span></li>`).join("") : "<li><span>Be the first!</span></li>";
  } catch { el.innerHTML = "<li><span>Online scores work on hindeclasses.com</span></li>"; }
}
initGoogle(); renderAccount(); flushPending();

</script>
